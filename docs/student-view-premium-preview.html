<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student View — 3 Design Directions</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.4.1/dist/css/tom-select.bootstrap5.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   HARNESS — toolbar, fake Nifty shell, theme accent. Not part of any design.
   The accent is fed into Bootstrap's own --bs-primary tokens, the same way
   the tenant's Settings theme colour reaches the real admin pages.
   Icons: only names that exist in Font Awesome 4.3 (the app's version).
   ═══════════════════════════════════════════════════════════════════════ */
:root { --p: #25476a; --p-rgb: 37, 71, 106; --page: #eef1f6; }
:root, [data-bs-theme="light"] {
  --bs-primary: var(--p); --bs-primary-rgb: var(--p-rgb);
  --bs-primary-bg-subtle: color-mix(in srgb, var(--p) 12%, #fff);
  --bs-primary-border-subtle: color-mix(in srgb, var(--p) 35%, #fff);
  --bs-primary-text-emphasis: color-mix(in srgb, var(--p) 70%, #000);
  --bs-link-color: var(--p); --bs-link-color-rgb: var(--p-rgb); --bs-link-hover-color: color-mix(in srgb, var(--p) 80%, #000);
  --bs-body-font-family: Poppins, system-ui, sans-serif; --bs-body-font-size: .8125rem;
}
[data-bs-theme="dark"] {
  --page: #15181c; --bs-body-bg: #1f2328; --bs-tertiary-bg: #272c32; --bs-border-color: #353b43;
  --bs-primary-bg-subtle: color-mix(in srgb, var(--p) 26%, #1f2328);
  --bs-primary-border-subtle: color-mix(in srgb, var(--p) 55%, #1f2328);
  --bs-primary-text-emphasis: color-mix(in srgb, var(--p) 45%, #fff);
  --bs-link-color: color-mix(in srgb, var(--p) 45%, #fff); --bs-link-hover-color: color-mix(in srgb, var(--p) 25%, #fff);
}
.btn-primary { --bs-btn-bg: var(--p); --bs-btn-border-color: var(--p); --bs-btn-hover-bg: color-mix(in srgb, var(--p), #000 14%); --bs-btn-hover-border-color: color-mix(in srgb, var(--p), #000 14%); --bs-btn-active-bg: color-mix(in srgb, var(--p), #000 22%); --bs-btn-active-border-color: color-mix(in srgb, var(--p), #000 22%); }
.btn-outline-primary { --bs-btn-color: var(--bs-link-color); --bs-btn-border-color: var(--bs-primary-border-subtle); --bs-btn-hover-bg: var(--p); --bs-btn-hover-border-color: var(--p); --bs-btn-active-bg: var(--p); --bs-btn-active-border-color: var(--p); }
.nav-pills { --bs-nav-pills-link-active-bg: var(--p); }
body { background: var(--page); min-height: 100vh; padding-bottom: 80px; }
h1, h2, h3, h4, h5, h6 { font-family: Poppins, sans-serif; }

.hx-bar { position: sticky; top: 0; z-index: 1030; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: center; padding: 9px 14px;
  background: color-mix(in srgb, var(--bs-body-bg) 88%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--bs-border-color); font-family: Ubuntu, sans-serif; }
.hx-grp { display: flex; align-items: center; gap: 4px; }
.hx-grp > span { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--bs-secondary-color); margin-inline-end: 4px; }
.hx-bar button { border: 1px solid var(--bs-border-color); background: var(--bs-body-bg); color: var(--bs-body-color); padding: 5px 11px; border-radius: 8px; font-size: 12px; font-weight: 500; }
.hx-bar button.on { background: var(--bs-emphasis-color); color: var(--bs-body-bg); border-color: var(--bs-emphasis-color); }
.hx-bar .sw { width: 22px; height: 22px; padding: 0; border-radius: 7px; border: 2px solid transparent; }
.hx-bar .sw.on { outline: 2px solid var(--bs-emphasis-color); outline-offset: 1px; background-clip: padding-box; }
.hx-note { max-width: 1240px; margin: 14px auto 0; padding: 0 16px; font-size: 12px; color: var(--bs-secondary-color); }
.hx-note b { color: var(--bs-emphasis-color); font-weight: 600; }

/* Fake Nifty chrome: the tenant-coloured, elliptical, overlapping header band. */
.nf-band { background: var(--bs-primary); color: #fff; padding: 22px 0 120px; border-radius: 0 0 50% 50% / 0 0 38px 38px; }
[data-bs-theme="dark"] .nf-band { background: color-mix(in srgb, var(--p), #000 40%); }
.nf-wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
.nf-band .breadcrumb { --bs-breadcrumb-divider-color: rgba(255,255,255,.55); --bs-breadcrumb-item-active-color: rgba(255,255,255,.75); margin: 0; font-size: 12px; }
.nf-band .breadcrumb a { color: rgba(255,255,255,.9); text-decoration: none; }
.nf-band h1 { font-size: 1.6rem; font-weight: 600; margin: 8px 0 0; }
.nf-band .lead { font-size: .95rem; color: rgba(255,255,255,.75); margin: 0; }
.nf-content { margin-top: -96px; }

@keyframes svRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes svPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(var(--bs-warning-rgb), .45); } 50% { box-shadow: 0 0 0 5px rgba(var(--bs-warning-rgb), 0); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ═══════════════════════════════════════════════════════════════════════
   DIRECTION A — "CAMPUS ID"
   Opaque identity card with a physical student card on the right, KPI tiles,
   underline tab rail. Scoped stylesheet (.sva) — layout is Bootstrap grid.
   ═══════════════════════════════════════════════════════════════════════ */
.sva { --acc: var(--bs-primary); --acc-rgb: var(--bs-primary-rgb); --ln: var(--bs-border-color); --mut: var(--bs-secondary-color); --ink: var(--bs-emphasis-color); --soft: var(--bs-tertiary-bg);
  --sh: 0 1px 2px rgba(15,23,42,.05), 0 14px 34px -18px rgba(15,23,42,.22); font-variant-numeric: tabular-nums; }
[data-bs-theme="dark"] .sva { --sh: 0 1px 2px rgba(0,0,0,.4), 0 18px 40px -20px rgba(0,0,0,.7); }
.sva .min-w-0, .svb .min-w-0 { min-width: 0; }
.sva .rise { animation: svRise .55s cubic-bezier(.2,.75,.25,1) both; animation-delay: calc(var(--i, 0) * 55ms); }
.sva .sheet { background: var(--bs-body-bg); border-radius: 18px; box-shadow: var(--sh); border: 1px solid color-mix(in srgb, var(--ln) 60%, transparent); }

.sva .hero { padding: 22px 24px; position: relative; overflow: hidden;
  background: radial-gradient(70% 140% at 0% 0%, rgba(var(--acc-rgb), .07), transparent 60%), var(--bs-body-bg); }
.sva .av { width: 96px; height: 96px; border-radius: 28px; flex: none; position: relative; display: grid; place-items: center;
  font: 600 32px/1 Poppins, sans-serif; letter-spacing: .02em; color: var(--bs-primary-text-emphasis);
  background: linear-gradient(145deg, var(--bs-primary-bg-subtle), color-mix(in srgb, var(--acc) 22%, var(--bs-body-bg)));
  box-shadow: 0 0 0 4px var(--bs-body-bg), 0 0 0 5.5px rgba(var(--acc-rgb), .22); }
.sva .av .dot { position: absolute; inset-inline-end: -3px; bottom: -3px; width: 24px; height: 24px; border-radius: 50%; border: 3px solid var(--bs-body-bg); display: grid; place-items: center; color: #fff; font-size: 10px; }
.sva .eyebrow { font: 600 10.5px/1 Ubuntu, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--bs-link-color); }
.sva .eyebrow b { color: var(--mut); font-weight: 500; letter-spacing: .08em; }
.sva .nm { font: 600 26px/1.15 Poppins, sans-serif; letter-spacing: -.02em; color: var(--ink); margin: 6px 0 10px; }
.sva .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; background: var(--soft); border: 1px solid var(--ln); font-size: 12px; color: var(--bs-body-color); white-space: nowrap; }
.sva .chip i { color: var(--mut); }
.sva .chip.ok { background: var(--bs-success-bg-subtle); border-color: var(--bs-success-border-subtle); color: var(--bs-success-text-emphasis); }
.sva .chip.ok i { color: inherit; }
.sva .pline { display: flex; align-items: center; gap: 10px; margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--ln); font-size: 12.5px; color: var(--mut); flex-wrap: wrap; }
.sva .pline b { color: var(--ink); font-weight: 500; }
.sva .pline a { color: var(--bs-link-color); text-decoration: none; }
.sva .hbtn { border-radius: 11px; font-weight: 500; padding: 7px 14px; font-size: 12.5px; }

/* the physical card */
.sva .idc { position: relative; aspect-ratio: 1.586; width: 100%; max-width: 360px; margin-inline-start: auto; border-radius: 18px; color: #fff; transform: rotate(-2.5deg); transition: transform .45s cubic-bezier(.2,.75,.25,1); }
.sva .idc:hover { transform: rotate(0) translateY(-3px); }
.sva .idc-face { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; padding: 18px 20px; display: flex; flex-direction: column;
  background:
    radial-gradient(90% 80% at 100% 0%, rgba(255,255,255,.26), transparent 55%),
    repeating-linear-gradient(118deg, rgba(255,255,255,.05) 0 2px, transparent 2px 10px),
    radial-gradient(120% 120% at 0% 100%, color-mix(in srgb, var(--acc), #000 45%), transparent 60%),
    linear-gradient(135deg, color-mix(in srgb, var(--acc), #000 30%), var(--acc) 55%, color-mix(in srgb, var(--acc), #fff 22%));
  box-shadow: 0 22px 44px -18px rgba(var(--acc-rgb), .75), inset 0 1px 0 rgba(255,255,255,.25); transition: filter .3s; }
.sva .idc-face::after { content: ""; position: absolute; inset: -40%; background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,.28) 50%, transparent 58%); transform: translateX(-60%); transition: transform .9s ease; }
.sva .idc:hover .idc-face::after { transform: translateX(60%); }
.sva .idc-top { display: flex; justify-content: space-between; align-items: center; font: 500 10.5px/1 Ubuntu, sans-serif; letter-spacing: .18em; text-transform: uppercase; opacity: .92; }
.sva .idc-top .fa-wifi { transform: rotate(90deg); font-size: 17px; opacity: .9; }
.sva .idc-chip { width: 42px; height: 31px; border-radius: 7px; margin-top: 14px; position: relative;
  background: linear-gradient(90deg, transparent 32%, rgba(90,60,10,.35) 32% 34%, transparent 34% 66%, rgba(90,60,10,.35) 66% 68%, transparent 68%),
    linear-gradient(0deg, transparent 46%, rgba(90,60,10,.35) 46% 54%, transparent 54%), linear-gradient(135deg, #f7e2a3, #c9a14a 55%, #f3d98b); box-shadow: inset 0 0 0 1px rgba(90,60,10,.25); }
.sva .idc-bal { margin-top: auto; }
.sva .idc-bal small { display: block; font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
.sva .idc-bal strong { font: 600 25px/1.1 Poppins, sans-serif; letter-spacing: -.01em; }
.sva .idc-bal strong em { font-style: normal; font-size: 12px; font-weight: 500; opacity: .75; margin-inline-start: 4px; }
.sva .idc-foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; margin-top: 10px; font-size: 11px; }
.sva .idc-foot .who { font-weight: 600; letter-spacing: .12em; text-transform: uppercase; line-height: 1.3; }
.sva .idc-foot .who span { display: block; font-weight: 400; letter-spacing: .06em; opacity: .75; }
.sva .idc-foot .uid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; opacity: .9; text-align: end; }
.sva .idc.is-blocked .idc-face { filter: grayscale(1) brightness(.78); }
.sva .idc-stamp { position: absolute; top: 44%; inset-inline: -8px; transform: rotate(-9deg); background: var(--bs-danger); color: #fff; text-align: center; font: 600 12px/1 Ubuntu, sans-serif; letter-spacing: .3em; padding: 9px 0; box-shadow: 0 10px 22px -10px rgba(var(--bs-danger-rgb), .9); }
.sva .idc.is-empty { transform: none; border: 2px dashed var(--ln); background: var(--soft); color: var(--mut); display: grid; place-items: center; text-align: center; }
.sva .idc.is-empty i.big { font-size: 30px; opacity: .5; display: block; margin-bottom: 8px; }

/* KPI tiles */
.sva .kpi { padding: 16px 18px; height: 100%; }
.sva .kpi .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 15px; flex: none; }
.sva .kpi .lab { font: 500 10.5px/1.2 Ubuntu, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); }
.sva .kpi .val { font: 600 23px/1.15 Poppins, sans-serif; letter-spacing: -.02em; color: var(--ink); margin-top: 12px; }
.sva .kpi .val small { font-size: 11px; font-weight: 500; color: var(--mut); margin-inline-start: 3px; letter-spacing: 0; }
.sva .kpi .ft { font-size: 11.5px; color: var(--mut); margin-top: 6px; }
.sva .meter { height: 6px; border-radius: 99px; background: var(--soft); overflow: hidden; margin-top: 10px; display: flex; gap: 2px; }
.sva .meter i { display: block; height: 100%; border-radius: 99px; transition: width .6s cubic-bezier(.2,.75,.25,1); }

/* tab rail + panes */
.sva .rail { display: flex; gap: 2px; overflow-x: auto; padding: 0 14px; border-bottom: 1px solid var(--ln); scrollbar-width: none; }
.sva .rail button { position: relative; border: 0; background: none; padding: 15px 14px 13px; font-size: 13px; font-weight: 500; color: var(--mut); white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; transition: color .2s; }
.sva .rail button:hover { color: var(--ink); }
.sva .rail button.on { color: var(--ink); }
.sva .rail button.on::after { content: ""; position: absolute; inset-inline: 10px; bottom: -1px; height: 2.5px; border-radius: 3px 3px 0 0; background: var(--acc); }
[data-bs-theme="dark"] .sva .rail button.on::after { background: var(--bs-link-color); }
.sva .rail button.on i { color: var(--bs-link-color); }
.sva .rail .cnt { font-size: 10.5px; padding: 1px 7px; border-radius: 99px; background: var(--soft); color: var(--mut); font-weight: 500; }
.sva .rail button.on .cnt { background: var(--bs-primary-bg-subtle); color: var(--bs-primary-text-emphasis); }
.sva .pane { padding: 22px 24px 24px; animation: svRise .4s cubic-bezier(.2,.75,.25,1) both; }
.sva .ph { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.sva .ph .pi { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--bs-primary-bg-subtle); color: var(--bs-primary-text-emphasis); font-size: 13px; }
.sva .ph h6 { margin: 0; font-size: 14px; font-weight: 600; color: var(--ink); }
.sva .ph .hint { font-size: 11.5px; color: var(--mut); }
.sva .fld { background: var(--soft); border-radius: 12px; padding: 10px 13px; height: 100%; }
.sva .fld .k { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--mut); display: flex; align-items: center; gap: 6px; }
.sva .fld .v { font-size: 13.5px; font-weight: 500; color: var(--ink); margin-top: 3px; overflow-wrap: anywhere; }
.sva .fld .v.none { color: var(--mut); font-weight: 400; }
.sva .fld.note { background: var(--bs-warning-bg-subtle); }
.sva .fld.note .k, .sva .fld.note .v { color: var(--bs-warning-text-emphasis); }

.sva .gd { border: 1px solid var(--ln); border-radius: 15px; padding: 14px 16px; transition: border-color .2s, box-shadow .2s; }
.sva .gd:hover { border-color: var(--bs-primary-border-subtle); box-shadow: 0 10px 24px -18px rgba(var(--acc-rgb), .6); }
.sva .gd + .gd, .sva .lnk + .gd { margin-top: 10px; }
.sva .gav { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 14px; flex: none; background: var(--bs-primary-bg-subtle); color: var(--bs-primary-text-emphasis); }
.sva .gd .gn { font-weight: 600; font-size: 14px; color: var(--ink); }
.sva .gd .rel { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--soft); color: var(--mut); margin-inline-start: 6px; }
.sva .gd .pri { font-size: 10.5px; padding: 2px 8px; border-radius: 99px; background: var(--bs-warning-bg-subtle); color: var(--bs-warning-text-emphasis); margin-inline-start: 4px; }
.sva .gd .ct { font-size: 12px; color: var(--mut); margin-top: 3px; display: flex; gap: 14px; flex-wrap: wrap; }
.sva .trk { display: flex; align-items: center; gap: 0; margin-top: 12px; font-size: 11px; color: var(--mut); flex-wrap: wrap; row-gap: 6px; }
.sva .trk .st { display: inline-flex; align-items: center; gap: 6px; }
.sva .trk .st i { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 8px; background: var(--soft); border: 1.5px solid var(--ln); color: transparent; }
.sva .trk .st.done { color: var(--bs-success-text-emphasis); }
.sva .trk .st.done i { background: var(--bs-success); border-color: var(--bs-success); color: #fff; }
.sva .trk .st.now { color: var(--bs-warning-text-emphasis); font-weight: 500; }
.sva .trk .st.now i { border-color: var(--bs-warning); background: var(--bs-warning-bg-subtle); animation: svPulse 1.8s infinite; }
.sva .trk .bar { width: 26px; height: 1.5px; background: var(--ln); margin: 0 7px; }
.sva .trk .bar.done { background: var(--bs-success); }
.sva .trk .meta { margin-inline-start: 10px; }
.sva .lnk { margin-top: 8px; border-radius: 12px; background: var(--bs-info-bg-subtle); color: var(--bs-info-text-emphasis); padding: 10px 12px; font-size: 12px; }

.sva .tl { position: relative; padding-inline-start: 26px; }
.sva .tl::before { content: ""; position: absolute; inset-inline-start: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--ln); border-radius: 2px; }
.sva .tl .it { position: relative; padding: 0 0 16px; }
.sva .tl .it:last-child { padding-bottom: 0; }
.sva .tl .it::before { content: ""; position: absolute; inset-inline-start: -25px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--bs-body-bg); border: 3px solid var(--tc, var(--mut)); }
.sva .tl .t { font-size: 13px; font-weight: 500; color: var(--ink); }
.sva .tl .m { font-size: 11.5px; color: var(--mut); margin-top: 2px; }
.sva .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .95em; letter-spacing: .02em; }
.sva .act { border: 1px solid var(--ln); border-radius: 15px; padding: 16px; }
.sva .act + .act { margin-top: 12px; }
.sva .act h6 { font-size: 13px; font-weight: 600; margin: 0 0 3px; color: var(--ink); }
.sva .act p { font-size: 12px; color: var(--mut); margin: 0 0 12px; }
.sva .form-control, .sva .btn { border-radius: 10px; }
.sva .input-group > .form-control { border-radius: 10px 0 0 10px; }
.sva .input-group > .btn { border-radius: 0 10px 10px 0; }

.sva .eq { display: flex; align-items: stretch; gap: 8px; flex-wrap: wrap; }
.sva .eq .c { flex: 1 1 130px; border-radius: 14px; padding: 12px 14px; background: var(--soft); }
.sva .eq .c .k { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--mut); }
.sva .eq .c .v { font: 600 18px/1.2 Poppins, sans-serif; color: var(--ink); margin-top: 4px; }
.sva .eq .c.in .v { color: var(--bs-success-text-emphasis); }
.sva .eq .c.out .v { color: var(--bs-danger-text-emphasis); }
.sva .eq .c.close { background: var(--bs-primary-bg-subtle); }
.sva .eq .c.close .k, .sva .eq .c.close .v { color: var(--bs-primary-text-emphasis); }
.sva .eq .op { align-self: center; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--ln); display: grid; place-items: center; font-size: 11px; color: var(--mut); flex: none; }
@media (max-width: 575.98px) { .sva .eq .op { display: none; } .sva .eq .c { flex-basis: calc(50% - 4px); } }
.sva .presets { display: inline-flex; gap: 4px; padding: 3px; border-radius: 11px; background: var(--soft); }
.sva .presets button { border: 0; background: none; border-radius: 8px; padding: 5px 11px; font-size: 12px; color: var(--mut); }
.sva .presets button.on { background: var(--bs-body-bg); color: var(--ink); box-shadow: 0 1px 3px rgba(15,23,42,.12); }

.sva .tblw { border: 1px solid var(--ln); border-radius: 14px; overflow: hidden; }
.sva .tbl { margin: 0; --bs-table-bg: transparent; font-size: 12.5px; }
.sva .tbl thead th { background: var(--soft); font: 500 10.5px/1 Ubuntu, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); padding: 11px 14px; border-bottom: 1px solid var(--ln); white-space: nowrap; }
.sva .tbl td { padding: 11px 14px; border-color: var(--ln); vertical-align: middle; }
.sva .tbl tbody tr:last-child td { border-bottom: 0; }
.sva .tbl tbody tr { transition: background .15s; }
.sva .tbl tbody tr:hover { background: color-mix(in srgb, var(--acc) 4%, transparent); }
.sva .tbl .bf td { background: color-mix(in srgb, var(--soft) 60%, transparent); color: var(--mut); font-style: italic; }
.sva .tbl tfoot td { background: var(--soft); font-weight: 600; color: var(--ink); padding: 11px 14px; border: 0; }

.svb { --acc: var(--bs-primary); --acc-rgb: var(--bs-primary-rgb); --ln: var(--bs-border-color); --mut: var(--bs-secondary-color); --ink: var(--bs-emphasis-color); --soft: var(--bs-tertiary-bg);

/* ═══════════════════════════════════════════════════════════════════════
   ADD / EDIT STUDENT — premium form (.sfx), shared by directions A and B.
   Built for non-technical staff: numbered sections that say what they are
   for, tap cards instead of dropdowns, "Required"/"Optional" words instead of
   asterisks, a live preview and a "Before you save" checklist.
   Choices are real radio inputs (Bootstrap .btn-check) so wire:model works.
   ═══════════════════════════════════════════════════════════════════════ */
.sfx { --acc: var(--bs-primary); --acc-rgb: var(--bs-primary-rgb); --ln: var(--bs-border-color); --mut: var(--bs-secondary-color); --ink: var(--bs-emphasis-color); --soft: var(--bs-tertiary-bg);
  --sh: 0 1px 2px rgba(15,23,42,.05), 0 14px 34px -18px rgba(15,23,42,.22); }
[data-bs-theme="dark"] .sfx { --sh: 0 1px 2px rgba(0,0,0,.4), 0 18px 40px -20px rgba(0,0,0,.7); }
.sfx .rise { animation: svRise .55s cubic-bezier(.2,.75,.25,1) both; animation-delay: calc(var(--i, 0) * 60ms); }
.sfx .sheet { background: var(--bs-body-bg); border-radius: 18px; box-shadow: var(--sh); border: 1px solid color-mix(in srgb, var(--ln) 60%, transparent); }
.sfx .top { padding: 18px 22px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.sfx .top h4 { margin: 0; font-size: 18px; font-weight: 600; color: var(--ink); }
.sfx .top p { margin: 2px 0 0; font-size: 12.5px; color: var(--mut); }
.sfx .steps { display: flex; gap: 6px; flex-wrap: wrap; margin-inline-start: auto; }
.sfx .steps button { border: 1px solid var(--ln); background: var(--bs-body-bg); border-radius: 99px; padding: 5px 12px 5px 5px; font-size: 12px; color: var(--bs-body-color); display: inline-flex; align-items: center; gap: 7px; }
.sfx .steps button .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); font-size: 11px; font-weight: 600; color: var(--mut); }
.sfx .steps button.done { border-color: var(--bs-success-border-subtle); background: var(--bs-success-bg-subtle); color: var(--bs-success-text-emphasis); }
.sfx .steps button.done .n { background: var(--bs-success); color: #fff; }
.sfx .steps button .o { font-size: 10.5px; color: var(--mut); }
.sfx .fsec { padding: 22px 24px 24px; scroll-margin-top: 70px; }
.sfx .fsec + .fsec { margin-top: 16px; }
.sfx .sec-h { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 18px; }
.sfx .sec-h .num { width: 36px; height: 36px; border-radius: 12px; flex: none; display: grid; place-items: center; font: 600 15px/1 Poppins, sans-serif; background: var(--bs-primary-bg-subtle); color: var(--bs-primary-text-emphasis); }
.sfx .sec-h h5 { margin: 0; font-size: 16px; font-weight: 600; color: var(--ink); }
.sfx .sec-h p { margin: 2px 0 0; font-size: 12.5px; color: var(--mut); }
.sfx .form-label { font-size: 13px; font-weight: 500; color: var(--ink); margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.sfx .req, .sfx .opt { font-size: 10px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; }
.sfx .req { background: var(--bs-danger-bg-subtle); color: var(--bs-danger-text-emphasis); }
.sfx .opt { background: var(--soft); color: var(--mut); }
.sfx .form-control, .sfx .form-select { min-height: 44px; border-radius: 12px; border-color: var(--ln); font-size: 13.5px; padding: 9px 13px; }

.sfx .input-group > .form-control { border-radius: 12px 0 0 12px; }

.sfx .hint { font-size: 11.5px; color: var(--mut); margin-top: 6px; display: flex; gap: 6px; line-height: 1.45; }
.sfx .hint i { margin-top: 2px; opacity: .7; }

  function stepHtml(pm) {
    return stepState().map(function (s, i) {
      if (pm) return '<button type="button" class="' + (s[2] ? 'done' : '') + '" data-step="' + s[0] + '"><span class="n">' + (s[2] ? '<i class="fa fa-check"></i>' : i + 1) + '</span>' + s[1] + (s[3] && !s[2] ? ' <span class="o">optional</span>' : '') + '</button>';
      return '<button type="button" class="btn btn-sm rounded-pill ' + (s[2] ? 'btn-success' : 'btn-outline-secondary') + '" data-step="' + s[0] + '">' + (s[2] ? '<i class="fa fa-check me-1"></i>' : '<span class="me-1">' + (i + 1) + '.</span>') + s[1] + '</button>';
    }).join('');
  }
  function barText() { var n = requiredLeft(); return n ? '<b>' + n + ' required</b> field' + (n > 1 ? 's' : '') + ' left' : '<b><i class="fa fa-check text-success me-1"></i>Ready to save</b>'; }
  function refreshLive() {
    var f = st.form, pm = st.dir !== 'c';
    function set(key, html, cls) { stage.querySelectorAll('[data-live="' + key + '"]').forEach(function (el) { el.innerHTML = html; if (cls) Object.keys(cls).forEach(function (c) { el.classList.toggle(c, cls[c]); }); }); }
    set('name', esc(f.name) || 'Student name', pm ? { ph: !f.name } : { 'text-body-secondary': !f.name, 'fst-italic': !f.name, 'fw-normal': !f.name });
    set('klass', esc(klassOf(f)) || 'Class not set', pm ? { ph: !klassOf(f) } : null);
    set('adm', esc(f.adm));
    set('age', ageOf(f.dob) || 'Age');
    if (!f.photo) set('av', (initialsOf(f.name) || '<i class="fa fa-user" style="opacity:.45"></i>') + (pm ? '<label for="f_photo" class="cam" title="Add photo"><i class="fa fa-camera"></i></label>' : ''));
    var uid = f.card ? uidGroups(f.card.replace(/[^0-9a-fA-F]/g, '').toUpperCase()) : '';
    set('cardchip', uid ? '<span class="badge text-bg-success"><i class="fa fa-credit-card me-1"></i>Card ' + uid.slice(-7) + '</span>' : '<span class="badge bg-body-tertiary text-body-secondary border">No card yet</span>');
    set('chk', checkHtml(pm));
    set('steps', stepHtml(pm));
    set('barst', barText());
    stage.querySelectorAll('[data-grade]').forEach(function (b) { toggleQuick(b, b.dataset.grade === f.grade, pm); });
    stage.querySelectorAll('[data-section]').forEach(function (b) { toggleQuick(b, b.dataset.section === f.section, pm); });
  }
  function toggleQuick(b, on, pm) { if (pm) b.classList.toggle('on', on); else { b.classList.toggle('btn-primary', on); b.classList.toggle('btn-outline-secondary', !on); } }
  function initTomSelect() {
    if (typeof TomSelect === 'undefined') return;
    stage.querySelectorAll('select[data-ts]').forEach(function (el) {
      new TomSelect(el, { allowEmptyOption: false, placeholder: 'Search a country…', maxOptions: 300, plugins: ['clear_button'],
        onChange: function (v) { st.form.nationality = v || ''; refreshLive(); } });
    });
  }

  /* ─────────────────────────────── wiring ─────────────────────────────── */
  var NOTES = {
    a: '<b>A · Campus ID</b>: identity card with a physical student card (balance, UID, BLOCKED stamp) + 4 KPI tiles + underline tab rail. Same 5 tabs as today. Needs a scoped stylesheet, like the customer and user view pages.',
    b: '<b>B · Wallet</b>: the student lives in a sticky left rail (dark balance panel with spend-power bar, parents, details). Tabs become Activity / Purchases / Top-ups / Card, and the statement is a day-grouped feed. Needs a scoped stylesheet.',
    c: '<b>C · Bootstrap native</b>: no custom CSS at all, only Bootstrap 5.3 / Nifty classes, so it follows the theme colour and dark mode for free. Same 5 tabs.'
  };
  var FORM_NOTE = { a: '<b>Add / Edit form, premium</b> (A and B share it): numbered steps, tap cards for gender, status and relation, searchable nationality, a live "What staff will see" preview and a "Before you save" checklist. Try typing, tapping and adding a photo.',
    c: '<b>Add / Edit form, Bootstrap native</b>: same steps and wording, built only from Bootstrap classes (outline buttons for gender, status and relation).' };
  FORM_NOTE.b = FORM_NOTE.a;
  var HEAD = { view: ['Student', 'Student', 'Card, statement, purchases and parents'], add: ['Add', 'Add Student', 'Student details, class, parents and card'], edit: ['Edit', 'Edit Student', 'Student details, class, parents and card'] };
  var stage = document.getElementById('stage');
  if (!st.page) st.page = 'view';
  st.form = st.page === 'edit' ? editForm() : blankForm();
  function save() { try { localStorage.setItem('student-view-preview', JSON.stringify({ dir: st.dir, page: st.page, card: st.card, bal: st.bal, tabA: st.tabA, tabB: st.tabB, tabC: st.tabC, acc: st.acc, mode: st.mode })); } catch (e) {} }
  function render() {
    var isForm = st.page !== 'view';
    stage.innerHTML = isForm ? renderForm(st.dir !== 'c') : st.dir === 'a' ? renderA() : st.dir === 'b' ? renderB() : renderC();
    if (!st.rise) stage.querySelectorAll('.rise').forEach(function (el) { el.style.animation = 'none'; });
    st.rise = false;
    if (isForm) initTomSelect();
    document.getElementById('hxNote').innerHTML = isForm ? FORM_NOTE[st.dir] : NOTES[st.dir];
    document.getElementById('nfCrumb').textContent = HEAD[st.page][0];
    document.getElementById('nfTitle').textContent = HEAD[st.page][1];
    document.getElementById('nfLead').textContent = HEAD[st.page][2];
    document.getElementById('hxCard').style.display = document.getElementById('hxBal').style.display = isForm ? 'none' : '';
    [['hxDir', 'dir'], ['hxPage', 'page'], ['hxCard', 'card'], ['hxBal', 'bal']].forEach(function (g) {
      document.querySelectorAll('#' + g[0] + ' button').forEach(function (b) { b.classList.toggle('on', b.dataset[g[1]] === st[g[1]]); });
    });
    save();
  }
  function hexRgb(h) { var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(','); }
  function setAcc(hex) { st.acc = hex; document.documentElement.style.setProperty('--p', hex); document.documentElement.style.setProperty('--p-rgb', hexRgb(hex));
    document.querySelectorAll('#hxAcc .sw').forEach(function (b) { b.classList.toggle('on', b.dataset.acc === hex); }); }
  function setMode(m) { st.mode = m; document.documentElement.setAttribute('data-bs-theme', m); document.querySelectorAll('#hxMode button').forEach(function (b) { b.classList.toggle('on', b.dataset.mode === m); }); }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('button, a');
    if (!el) return;
    if (el.tagName === 'A') { e.preventDefault(); return; }
    var d = el.dataset, f = st.form;
    if (d.dir) { st.dir = d.dir; st.rise = true; }
    else if (d.page) { st.page = d.page; st.form = d.page === 'edit' ? editForm() : blankForm(); st.rise = true; window.scrollTo(0, 0); }
    else if (d.card) st.card = d.card;
    else if (d.bal) st.bal = d.bal;
    else if (d.acc) { setAcc(d.acc); save(); return; }
    else if (d.mode) { setMode(d.mode); save(); return; }
    else if (d.aTab) st.tabA = d.aTab;
    else if (d.bTab) st.tabB = d.bTab;
    else if (d.cTab) st.tabC = d.cTab;
    else if (d.invite) st.invite = st.invite === +d.invite ? 0 : +d.invite;
    else if (d.cardSet) st.card = d.cardSet;
    else if (d.preset) st.preset = d.preset;
    else if (d.step) { var t = document.getElementById(d.step); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    else if (d.grade !== undefined) { f.grade = f.grade === d.grade ? '' : d.grade; var gi = document.getElementById('f_grade'); if (gi) gi.value = f.grade; refreshLive(); return; }
    else if (d.section !== undefined) { f.section = f.section === d.section ? '' : d.section; var si = document.getElementById('f_section'); if (si) si.value = f.section; refreshLive(); return; }
    else if (d.primary) f.parents.forEach(function (p, i) { p.primary = i === +d.primary; });
    else if (d.remove) { var wasMain = f.parents[+d.remove].primary; f.parents.splice(+d.remove, 1); if (wasMain && f.parents.length) f.parents[0].primary = true; }
    else if (d.addp) f.parents.push({ name: '', mobile: '', email: '', relation: f.parents.some(function (p) { return p.relation === 'father'; }) ? 'mother' : 'father', primary: !f.parents.length });
    else if (d.photoRemove) f.photo = '';
    else return;
    render();
  });
  function fieldChanged(e) {
    var t = e.target, f = st.form;
    if (t.dataset.f && t.tagName !== 'SELECT') { f[t.dataset.f] = t.value; refreshLive(); }
    else if (t.dataset.pf) { var k = t.dataset.pf.split('.'); f.parents[+k[0]][k[1]] = t.value; refreshLive(); }
  }
  document.addEventListener('input', fieldChanged);
  document.addEventListener('change', function (e) {
    if (e.target.matches('[data-photo-input]') && e.target.files[0]) { st.form.photo = URL.createObjectURL(e.target.files[0]); render(); return; }
    if (e.target.type === 'radio') fieldChanged(e);
  });

  setAcc(st.acc || '#25476a');
  setMode(st.mode || 'light');
  render();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purchase Family Add</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.3.0/css/font-awesome.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------------------
   Tokens mirror resources/css/purchase-premium.css (.pcx "Command Deck").
   --bs-primary is the app theme colour — the accent picker below swaps it.
   --------------------------------------------------------------------------- */
:root { --bs-primary: #25476a; --bs-primary-rgb: 37, 71, 106; --page: #eef1f6; }
:root[data-bs-theme="dark"] { --page: #151a20; }
* { box-sizing: border-box; }
body { margin: 0; font-family: Poppins, system-ui, sans-serif; background: var(--page); color: #0b1220; -webkit-font-smoothing: antialiased; }
:root[data-bs-theme="dark"] body { color: #f1f5f9; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }

:root, .pcx {
    --pcx-ok: #16a34a; --pcx-ok-rgb: 22,163,74;
    --pcx-bad: #dc2626; --pcx-bad-rgb: 220,38,38;
    --pcx-warn: #d97706;
    --pcx-acc: var(--bs-primary); --pcx-acc-rgb: var(--bs-primary-rgb);
    --pcx-acc-d: color-mix(in srgb, var(--pcx-acc), #000 18%);
    --pcx-tint: color-mix(in srgb, var(--pcx-acc), transparent 91%);
    --pcx-acc-ink: var(--pcx-acc-d);
    --pcx-line-acc: color-mix(in srgb, var(--pcx-acc), transparent 78%);
    --pcx-sf: #fff; --pcx-sf2: #f7f9fc; --pcx-sf3: #eef2f7;
    --pcx-ink: #0b1220; --pcx-ink2: #334155; --pcx-mut: #748196;
    --pcx-ln: #e3e8ef; --pcx-lns: #eef1f6;
    --pcx-shadow: 0 1px 2px rgba(16,24,40,.04), 0 10px 24px -18px rgba(16,24,40,.3);
    --pcx-shadow-lg: 0 1px 2px rgba(16,24,40,.05), 0 24px 60px -24px rgba(16,24,40,.45);
    --hatch: repeating-linear-gradient(135deg, transparent 0 6px, var(--pcx-ln) 6px 7px);
    font-size: 12.5px; color: var(--pcx-ink);
}
:root[data-bs-theme="dark"], [data-bs-theme="dark"] .pcx {
    --pcx-sf: #1e242b; --pcx-sf2: #242b33; --pcx-sf3: #2b333c;
    --pcx-ink: #f1f5f9; --pcx-ink2: #cbd5e1; --pcx-mut: #8d9bad;
    --pcx-ln: #333c46; --pcx-lns: #2d353e;
    --pcx-tint: color-mix(in srgb, var(--pcx-acc), transparent 82%);
    --pcx-acc-ink: color-mix(in srgb, var(--pcx-acc), #fff 45%);
    --pcx-shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -18px rgba(0,0,0,.6);
    --pcx-shadow-lg: 0 1px 2px rgba(0,0,0,.35), 0 24px 60px -24px rgba(0,0,0,.8);
}

/* ---------------------------------------------------------------- harness */
.bar { position: sticky; top: 0; z-index: 40; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 10px 16px; background: color-mix(in srgb, var(--page) 86%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--pcx-ln); }
.bar h1 { font-size: 13px; margin: 0; font-weight: 800; color: var(--pcx-ink); }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--pcx-sf); border: 1px solid var(--pcx-ln); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 13px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--pcx-mut); }
.seg button.on { background: var(--pcx-acc); color: #fff; }
.accents { display: inline-flex; gap: 6px; }
.accents button { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--pcx-sf); box-shadow: 0 0 0 1px var(--pcx-ln); background: var(--c); }
.accents button.on { box-shadow: 0 0 0 2px var(--c); }
.note { max-width: 1180px; margin: 16px auto 0; padding: 0 16px; font-size: 12.5px; line-height: 1.6; color: var(--pcx-ink2); }
.note b { color: var(--pcx-ink); }
.note .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.note .tags span { background: var(--pcx-sf); border: 1px solid var(--pcx-ln); border-radius: 999px; padding: 2px 9px; font-size: 11px; font-weight: 600; }
.stage { max-width: 1180px; margin: 0 auto; padding: 14px 16px 80px; }

/* ------------------------------------------------------- existing .pcx card */
.pcx-card { background: var(--pcx-sf); border: 1px solid var(--pcx-ln); border-radius: 14px; box-shadow: var(--pcx-shadow); }
.pcx-chd { display: flex; align-items: center; gap: 9px; padding: 10px 13px; border-bottom: 1px solid var(--pcx-lns); background: var(--pcx-sf2); border-radius: 13px 13px 0 0; }
.pcx-ci { width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--pcx-tint); color: var(--pcx-acc-ink); flex: none; }
.pcx-ct { font-size: 12px; font-weight: 800; margin: 0; }
.pcx-cnt { margin-inline-start: auto; font-size: 10px; font-weight: 800; color: var(--pcx-mut); background: var(--pcx-sf3); border: 1px solid var(--pcx-ln); padding: 2px 8px; border-radius: 999px; }
.pcx-search { display: flex; align-items: center; gap: 9px; border: 1.5px dashed color-mix(in srgb, var(--pcx-acc), transparent 62%); border-radius: 10px; padding: 6px 11px; margin: 11px 13px; position: relative; flex-wrap: wrap; }
.pcx-search > .fa-barcode { color: var(--pcx-acc-ink); font-size: 14px; }
.sf { flex: 1; min-width: 200px; position: relative; }
.sf input { width: 100%; height: 35px; border: 1px solid var(--pcx-ln); border-radius: 8px; background: var(--pcx-sf); padding: 0 12px; font-size: 12.5px; outline: none; }
.sf input:focus { border-color: var(--pcx-acc); box-shadow: 0 0 0 3px rgba(var(--pcx-acc-rgb), .14); }

/* the existing TomSelect dropdown, restyled to match the screenshot */
.dd { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--pcx-sf); border: 1px solid var(--pcx-ln); border-radius: 12px; box-shadow: var(--pcx-shadow-lg); max-height: 420px; overflow: auto; z-index: 30; padding: 6px; display: none; }
.dd.on { display: block; }
.dd-grp { font-size: 9.5px; font-weight: 800; letter-spacing: .9px; text-transform: uppercase; color: var(--pcx-mut); padding: 8px 10px 4px; display: flex; align-items: center; gap: 6px; }
.dd-row { display: flex; gap: 11px; align-items: center; padding: 8px 10px; border-radius: 9px; cursor: pointer; }
.dd-row:hover, .dd-row.hi { background: var(--pcx-sf3); }
.dd-row .nm { font-weight: 700; font-size: 12.5px; }
.dd-row .meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.chip { font-size: 10px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; color: var(--pcx-ink2); background: var(--pcx-sf2); border: 1px solid var(--pcx-ln); padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
.chip b { color: var(--pcx-mut); font-weight: 700; }
.chip.acc { background: var(--pcx-tint); color: var(--pcx-acc-ink); border-color: var(--pcx-line-acc); }
.dd-row .go { margin-inline-start: auto; color: var(--pcx-mut); font-size: 11px; font-weight: 700; white-space: nowrap; }
.dd-empty { padding: 18px; text-align: center; color: var(--pcx-mut); }

.thumb { width: 38px; height: 38px; border-radius: 10px; flex: none; display: grid; place-items: center; font-weight: 800; font-size: 12px; color: #fff; background: linear-gradient(135deg, var(--a), var(--b)); text-shadow: 0 1px 2px rgba(0,0,0,.25); position: relative; overflow: hidden; }
.thumb.sm { width: 30px; height: 30px; border-radius: 8px; font-size: 10.5px; }
.thumb.lg { width: 48px; height: 48px; border-radius: 12px; font-size: 14px; }
.thumb.plain { background: var(--pcx-sf3); color: var(--pcx-mut); text-shadow: none; }
.sw { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); display: inline-block; flex: none; }
.sw.lg { width: 16px; height: 16px; }

/* entry buttons next to the field */
.mode { display: inline-flex; background: var(--pcx-sf3); border-radius: 9px; padding: 3px; }
.mode button { border: 0; background: none; height: 29px; padding: 0 12px; border-radius: 7px; font-size: 11.5px; font-weight: 700; color: var(--pcx-mut); display: inline-flex; align-items: center; gap: 6px; }
.mode button.on { background: var(--pcx-sf); color: var(--pcx-acc-ink); box-shadow: 0 1px 2px rgba(16,24,40,.12); }
.btn { height: 35px; border-radius: 8px; padding: 0 13px; border: 1px solid var(--pcx-ln); background: var(--pcx-sf); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.btn:hover { border-color: var(--pcx-acc); color: var(--pcx-acc-ink); }
.btn.pri { background: var(--pcx-acc); border-color: var(--pcx-acc); color: #fff; }
.btn.pri:hover { background: var(--pcx-acc-d); color: #fff; }
.btn.pri:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { border-color: transparent; background: none; color: var(--pcx-mut); }
.kbd { font-size: 9.5px; font-weight: 800; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; opacity: .6; }
.iconbtn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--pcx-ln); background: var(--pcx-sf); color: var(--pcx-mut); display: inline-flex; align-items: center; justify-content: center; }
.iconbtn:hover { color: var(--pcx-bad); border-color: rgba(var(--pcx-bad-rgb), .35); }

/* ------------------------------------------------------- shared panel shell */
.panel { margin: 0 13px 12px; border: 1px solid var(--pcx-line-acc); border-radius: 12px; background: var(--pcx-sf); box-shadow: 0 0 0 4px var(--pcx-tint); overflow: hidden; animation: drop .18s ease-out; }
@keyframes drop { from { opacity: 0; transform: translateY(-6px); } }
.p-hd { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 11px 13px; background: var(--pcx-sf2); border-bottom: 1px solid var(--pcx-lns); }
.p-ttl { min-width: 0; flex: 1; }
.p-ttl b { display: block; font-size: 14px; font-weight: 800; }
.p-ttl small { color: var(--pcx-mut); font-weight: 600; font-size: 11px; }
.fld { display: flex; flex-direction: column; gap: 2px; }
.fld label { font-size: 9px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: var(--pcx-mut); }
.num { width: 86px; height: 31px; border-radius: 7px; border: 1px solid var(--pcx-ln); background: var(--pcx-sf); padding: 0 8px; text-align: end; font-weight: 700; font-variant-numeric: tabular-nums; outline: none; }
.num:focus { border-color: var(--pcx-acc); box-shadow: 0 0 0 3px rgba(var(--pcx-acc-rgb), .14); }
.num.sm { width: 56px; }
.p-ft { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 13px; border-top: 1px solid var(--pcx-lns); background: var(--pcx-sf2); }
.p-sum { display: flex; gap: 16px; flex-wrap: wrap; font-weight: 600; color: var(--pcx-mut); font-size: 11.5px; }
.p-sum b { color: var(--pcx-ink); font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; margin-inline-end: 3px; }
.p-ft .sp { flex: 1; }
.hint { font-size: 11px; color: var(--pcx-mut); display: inline-flex; gap: 6px; align-items: center; }

/* ================================================== A · Size-run Matrix */
.mx-wrap { overflow-x: auto; padding: 4px 6px 8px; }
.mx { border-collapse: separate; border-spacing: 6px; min-width: 100%; }
.mx th { font-size: 10px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--pcx-mut); padding: 4px 2px 0; white-space: nowrap; }
.mx th.sz button { width: 100%; min-width: 58px; border: 1px dashed var(--pcx-ln); background: none; border-radius: 7px; padding: 4px 0; font-size: 14px; font-weight: 800; color: var(--pcx-ink); letter-spacing: 0; text-transform: none; }
.mx th.sz button:hover { border-color: var(--pcx-acc); background: var(--pcx-tint); color: var(--pcx-acc-ink); }
.mx th.sz button small { display: block; font-size: 8.5px; font-weight: 700; color: var(--pcx-mut); letter-spacing: .5px; text-transform: uppercase; }
.mx td { padding: 0; }
.mx .rowh { display: flex; align-items: center; gap: 8px; min-width: 170px; text-align: start; border: 0; background: none; padding: 4px 6px; border-radius: 8px; width: 100%; }
.mx .rowh:hover { background: var(--pcx-tint); }
.mx .rowh b { font-weight: 700; font-size: 12.5px; display: block; }
.mx .rowh small { font-size: 10px; color: var(--pcx-mut); font-weight: 600; }
.mx .rowh .plus { margin-inline-start: auto; font-size: 10px; color: var(--pcx-mut); opacity: 0; }
.mx .rowh:hover .plus { opacity: 1; }
.cell { position: relative; }
.cell input { width: 100%; min-width: 58px; height: 44px; border-radius: 9px; border: 1.5px solid var(--pcx-ln); background: var(--pcx-sf); text-align: center; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; outline: none; padding: 0 0 8px; -moz-appearance: textfield; }
.cell input::-webkit-inner-spin-button { -webkit-appearance: none; }
.cell input::placeholder { color: var(--pcx-ln); font-weight: 600; }
.cell input:focus { border-color: var(--pcx-acc); box-shadow: 0 0 0 3px rgba(var(--pcx-acc-rgb), .16); }
.cell.has input { background: var(--pcx-tint); border-color: var(--pcx-line-acc); color: var(--pcx-acc-ink); }
.cell .stk { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-size: 8.5px; font-weight: 700; color: var(--pcx-mut); pointer-events: none; letter-spacing: .3px; }
.cell .stk.low { color: var(--pcx-warn); }
.cell .stk.out { color: var(--pcx-bad); }
.nocell { height: 44px; border-radius: 9px; background: var(--hatch); border: 1px dashed var(--pcx-ln); display: grid; place-items: center; color: var(--pcx-mut); font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
.mx .tot { text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--pcx-ink2); font-size: 13px; min-width: 50px; }
.mx tfoot td { font-size: 11px; font-weight: 800; color: var(--pcx-mut); text-align: center; padding-top: 2px; font-variant-numeric: tabular-nums; }
.mx tfoot td:first-child { text-align: start; padding-inline-start: 8px; text-transform: uppercase; letter-spacing: .6px; font-size: 9.5px; }

/* ================================================== B · Catalogue Ledger */
.scrim { position: fixed; inset: 0; background: rgba(10,15,25,.45); backdrop-filter: blur(2px); z-index: 60; display: none; }
.scrim.on { display: block; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(1080px, 100vw); background: var(--pcx-sf); z-index: 61; display: flex; flex-direction: column; box-shadow: var(--pcx-shadow-lg); transform: translateX(102%); transition: transform .22s ease; }
.drawer.on { transform: none; }
.dw-hd { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--pcx-lns); }
.dw-hd h3 { margin: 0; font-size: 15px; font-weight: 800; }
.dw-hd p { margin: 0; font-size: 11px; color: var(--pcx-mut); font-weight: 600; }
.dw-tabs { margin-inline-start: auto; }
.dw-body { flex: 1; overflow: auto; }
.lgr { width: 100%; border-collapse: collapse; min-width: 860px; }
.lgr thead th { position: sticky; z-index: 2; background: var(--pcx-sf2); text-align: start; font-size: 9px; font-weight: 800; letter-spacing: .9px; text-transform: uppercase; color: var(--pcx-mut); padding: 8px 8px 4px; white-space: nowrap; }
.lgr thead tr.l th { top: 0; }
.lgr thead tr.f th { top: 27px; padding: 0 8px 8px; border-bottom: 1px solid var(--pcx-ln); }
.lgr thead th.e, .lg td.e { text-align: end; }
.flt { width: 100%; height: 28px; border-radius: 7px; border: 1px solid var(--pcx-ln); background: var(--pcx-sf); padding: 0 8px 0 24px; font-size: 11.5px; outline: none; font-weight: 500; }
.flt:focus { border-color: var(--pcx-acc); box-shadow: 0 0 0 3px rgba(var(--pcx-acc-rgb), .14); }
.flt-w { position: relative; }
.flt-w .fa { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font-size: 10px; color: var(--pcx-mut); }
.flt-w.on .flt { border-color: var(--pcx-line-acc); background: var(--pcx-tint); }
.lgr td { padding: 7px 8px; border-bottom: 1px solid var(--pcx-lns); vertical-align: middle; font-size: 12px; }
.lgr tr.fam td { background: var(--pcx-sf); }
.lgr tr.fam:hover td { background: var(--pcx-sf2); }
.lgr tr.var td { background: color-mix(in srgb, var(--pcx-sf2) 60%, var(--pcx-sf)); }
.lgr tr.var td.nmc { padding-inline-start: 44px; }
.lgr tr.var.sel td { background: var(--pcx-tint); }
.lgr tr.var.sel td:first-child { box-shadow: inset 3px 0 0 var(--pcx-acc); }
.lgr .nmw { display: flex; align-items: center; gap: 9px; }
.lgr .nmw b { font-weight: 700; display: block; }
.lgr .nmw small { font-size: 10.5px; color: var(--pcx-mut); font-weight: 600; }
.caret { width: 22px; height: 22px; border-radius: 6px; border: 0; background: var(--pcx-sf3); color: var(--pcx-mut); font-size: 10px; flex: none; transition: transform .15s; }
.caret.open { transform: rotate(90deg); background: var(--pcx-tint); color: var(--pcx-acc-ink); }
.mono { font-variant-numeric: tabular-nums; color: var(--pcx-ink2); font-weight: 600; }
.hl { background: rgba(250, 204, 21, .35); border-radius: 3px; color: inherit; }
.cb { width: 16px; height: 16px; border-radius: 5px; border: 1.5px solid var(--pcx-ln); background: var(--pcx-sf); display: inline-grid; place-items: center; font-size: 9px; color: transparent; }
.cb.on { background: var(--pcx-acc); border-color: var(--pcx-acc); color: #fff; }
.cb.part { background: var(--pcx-tint); border-color: var(--pcx-acc); color: var(--pcx-acc-ink); }
.step { display: inline-flex; align-items: center; border: 1px solid var(--pcx-ln); border-radius: 8px; overflow: hidden; background: var(--pcx-sf); }
.step button { width: 26px; height: 28px; border: 0; background: var(--pcx-sf2); color: var(--pcx-mut); font-size: 10px; }
.step button:hover { color: var(--pcx-acc-ink); background: var(--pcx-tint); }
.step input { width: 40px; height: 28px; border: 0; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; background: none; outline: none; -moz-appearance: textfield; }
.step input::-webkit-inner-spin-button { -webkit-appearance: none; }
.step.on { border-color: var(--pcx-acc); }
.step.on input { color: var(--pcx-acc-ink); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; }
.stock-b { font-weight: 700; font-variant-numeric: tabular-nums; }
.stock-b.low { color: var(--pcx-warn); }
.stock-b.out { color: var(--pcx-bad); }
.dw-ft { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--pcx-ln); background: var(--pcx-sf2); }
.dw-ft .sp { flex: 1; }
.basket { display: flex; gap: 5px; flex-wrap: wrap; max-width: 520px; }
.basket span { font-size: 10.5px; font-weight: 700; background: var(--pcx-sf); border: 1px solid var(--pcx-ln); border-radius: 999px; padding: 2px 8px; display: inline-flex; gap: 5px; align-items: center; }

/* ================================================== C · Chip Composer */
.cc-steps { padding: 4px 13px 6px; }
.cc-step { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 11px 0; border-bottom: 1px dashed var(--pcx-lns); }
.cc-step:last-child { border-bottom: 0; }
.cc-n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; background: var(--pcx-sf3); color: var(--pcx-mut); }
.cc-step.done .cc-n { background: var(--pcx-acc); color: #fff; }
.cc-lbl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; min-height: 24px; }
.cc-lbl b { font-size: 12px; font-weight: 800; }
.cc-lbl small { color: var(--pcx-mut); font-weight: 600; font-size: 11px; }
.cc-lbl .lnk { border: 0; background: none; color: var(--pcx-acc-ink); font-weight: 700; font-size: 11px; padding: 2px 4px; }
.cc-lbl .lnk:first-of-type { margin-inline-start: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.cchip { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 13px 0 9px; border-radius: 999px; border: 1.5px solid var(--pcx-ln); background: var(--pcx-sf); font-weight: 700; font-size: 12px; transition: .12s; }
.cchip small { color: var(--pcx-mut); font-weight: 600; font-size: 10.5px; }
.cchip:hover { border-color: var(--pcx-acc); }
.cchip.on { border-color: var(--pcx-acc); background: var(--pcx-tint); color: var(--pcx-acc-ink); box-shadow: 0 0 0 3px rgba(var(--pcx-acc-rgb), .1); }
.cchip .tick { width: 15px; height: 15px; border-radius: 50%; background: var(--pcx-acc); color: #fff; font-size: 8px; display: none; place-items: center; }
.cchip.on .tick { display: inline-grid; }
.skeys { display: flex; flex-wrap: wrap; gap: 7px; }
.skey { min-width: 52px; height: 46px; padding: 0 10px; border-radius: 11px; border: 1.5px solid var(--pcx-ln); background: var(--pcx-sf); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: .12s; }
.skey b { font-size: 16px; font-weight: 800; line-height: 1.1; }
.skey small { font-size: 8.5px; font-weight: 700; color: var(--pcx-mut); letter-spacing: .3px; }
.skey:hover { border-color: var(--pcx-acc); }
.skey.on { background: var(--pcx-acc); border-color: var(--pcx-acc); color: #fff; }
.skey.on small { color: rgba(255,255,255,.75); }
.qrow { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px; }
.lines { display: flex; flex-wrap: wrap; gap: 6px; }
.ln { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 4px 0 9px; border-radius: 8px; background: var(--pcx-sf2); border: 1px solid var(--pcx-ln); font-size: 11.5px; font-weight: 700; }
.ln .q { display: inline-flex; align-items: center; background: var(--pcx-sf); border: 1px solid var(--pcx-ln); border-radius: 6px; }
.ln .q button { border: 0; background: none; width: 20px; height: 22px; font-size: 9px; color: var(--pcx-mut); }
.ln .q span { min-width: 18px; text-align: center; font-variant-numeric: tabular-nums; }
.ln.miss { background: var(--hatch); color: var(--pcx-mut); text-decoration: line-through; border-style: dashed; padding-inline-end: 9px; }
.ln .x { border: 0; background: none; color: var(--pcx-mut); width: 20px; height: 22px; font-size: 10px; }
.ln .x:hover { color: var(--pcx-bad); }
.empty-l { color: var(--pcx-mut); font-size: 11.5px; font-weight: 600; }

/* ------------------------------------------------------------- the cart */
.tbl-wrap { overflow-x: auto; }
.pcx-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 640px; }
.pcx-table thead th { font-size: 9px; font-weight: 800; letter-spacing: .9px; text-transform: uppercase; color: var(--pcx-mut); padding: 8px 10px; background: var(--pcx-sf2); border-top: 1px solid var(--pcx-lns); border-bottom: 1px solid var(--pcx-lns); text-align: start; white-space: nowrap; }
.pcx-table th.e, .pcx-table td.e { text-align: end; }
.pcx-table tbody td { padding: 7px 10px; border-bottom: 1px solid var(--pcx-lns); vertical-align: middle; }
.pcx-table tbody tr:hover td { background: color-mix(in srgb, var(--pcx-acc), transparent 96%); }
.pcx-table tbody tr.flash td { animation: flash 1.1s ease-out; }
@keyframes flash { from { background: rgba(var(--pcx-ok-rgb), .16); } }
.pcx-idx { width: 26px; height: 22px; border-radius: 6px; background: var(--pcx-sf3); color: var(--pcx-mut); font-size: 10.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.pcx-pname { font-size: 12.5px; font-weight: 700; margin: 0; }
.pcx-pbar { font-size: 10.5px; color: var(--pcx-mut); font-variant-numeric: tabular-nums; letter-spacing: .3px; }
.pcx-pvar { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600; color: var(--pcx-ink2); margin-top: 2px; }
.pcx-cell { width: 84px; background: var(--pcx-sf2); border: 1px solid transparent; border-radius: 7px; padding: 5px 8px; text-align: end; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; outline: none; }
.pcx-cell:focus { background: var(--pcx-sf); border-color: var(--pcx-acc); }
.pcx-rtot { text-align: end; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pcx-table tfoot td { padding: 9px 10px; background: var(--pcx-sf2); border-top: 2px solid var(--pcx-ln); font-size: 12.5px; font-weight: 800; text-align: end; font-variant-numeric: tabular-nums; border-radius: 0 0 0 0; }
.pcx-table tfoot td.lab { text-align: start; font-size: 9.5px; letter-spacing: .9px; text-transform: uppercase; color: var(--pcx-mut); }
.pcx-empty { text-align: center; padding: 28px 10px; color: var(--pcx-mut); }
.pcx-empty .fa { font-size: 22px; opacity: .5; }
.pcx-empty .t { font-weight: 800; color: var(--pcx-ink2); margin-top: 6px; }
.fam-sep td { background: var(--pcx-sf2) !important; font-size: 10px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--pcx-mut); padding: 5px 10px !important; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; transition: .22s; background: #0b1220; color: #fff; padding: 11px 16px; border-radius: 11px; font-weight: 600; font-size: 12.5px; z-index: 90; display: flex; gap: 8px; align-items: center; pointer-events: none; }
.toast .fa { color: #4ade80; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 640px) {
    .pcx-search { padding: 8px; }
    .sf { min-width: 100%; order: 2; }
    .pcx-search > .fa-barcode { display: none; }
    .p-hd .fld { flex: 1 1 40%; }
    .p-hd .num { width: 100%; }
    .p-ft .btn.pri { flex: 1; justify-content: center; }
    .dw-tabs { margin-inline-start: 0; }
}
</style>
</head>
<body>

<div class="bar">
    <h1><i class="fa fa-cubes"></i>&nbsp; Purchase · Add by Family</h1>
    <div class="seg" id="dirSeg">
        <button data-dir="A" class="on">A · Size-run Matrix</button>
        <button data-dir="B">B · Catalogue Ledger</button>
        <button data-dir="C">C · Chip Composer</button>
    </div>
    <div class="seg" id="themeSeg">
        <button data-theme="light" class="on"><i class="fa fa-sun-o"></i> Light</button>
        <button data-theme="dark"><i class="fa fa-moon-o"></i> Dark</button>
    </div>
    <div class="accents" id="accents" title="Theme colour (Settings → Colors)">
        <button style="--c:#25476a" data-c="#25476a" data-rgb="37,71,106" class="on"></button>
        <button style="--c:#4f46e5" data-c="#4f46e5" data-rgb="79,70,229"></button>
        <button style="--c:#0d9488" data-c="#0d9488" data-rgb="13,148,136"></button>
        <button style="--c:#be123c" data-c="#be123c" data-rgb="190,18,60"></button>
    </div>
</div>

<div class="note" id="note"></div>

<main class="stage">
    <div class="pcx">
        <div class="pcx-card">
            <div class="pcx-chd">
                <div class="pcx-ci"><i class="fa fa-cubes"></i></div>
                <h2 class="pcx-ct">Item Info</h2>
                <span class="pcx-cnt" id="lineCount">0 lines</span>
            </div>

            <div class="pcx-search" id="searchRow">
                <i class="fa fa-barcode"></i>
                <div id="entryLead"></div>
                <div class="sf">
                    <input id="q" autocomplete="off" placeholder="Scan barcode or search product…">
                    <div class="dd" id="dd"></div>
                </div>
                <div id="entryTail"></div>
            </div>

            <div id="panel"></div>

            <div class="tbl-wrap">
                <table class="pcx-table">
                    <thead>
                        <tr>
                            <th style="width:34px">#</th>
                            <th style="width:38%">Product</th>
                            <th class="e">Unit Price</th>
                            <th class="e">Quantity</th>
                            <th class="e">Total</th>
                            <th style="width:44px"></th>
                        </tr>
                    </thead>
                    <tbody id="cart"></tbody>
                    <tfoot id="cartFoot"></tfoot>
                </table>
            </div>
        </div>
    </div>
</main>

<!-- B · drawer -->
<div class="pcx">
    <div class="scrim" id="scrim"></div>
    <aside class="drawer" id="drawer" aria-label="Product catalogue">
        <div class="dw-hd">
            <div class="pcx-ci" style="width:34px;height:34px;font-size:14px"><i class="fa fa-th-list"></i></div>
            <div>
                <h3>Product catalogue</h3>
                <p>Filter any column · expand a family · type quantities · add in one go</p>
            </div>
            <div class="mode dw-tabs" id="dwGroup">
                <button class="on" data-g="1"><i class="fa fa-sitemap"></i> Families</button>
                <button data-g="0"><i class="fa fa-list"></i> Flat list</button>
            </div>
            <button class="iconbtn" id="dwClose" title="Close (Esc)"><i class="fa fa-times"></i></button>
        </div>
        <div class="dw-body">
            <table class="lgr">
                <thead>
                    <tr class="l">
                        <th style="width:30px"></th>
                        <th>Product</th>
                        <th>SKU / Code</th>
                        <th>Barcode</th>
                        <th>Colour</th>
                        <th>Size</th>
                        <th class="e">Stock</th>
                        <th class="e">Cost</th>
                        <th class="e" style="width:110px">Order Qty</th>
                    </tr>
                    <tr class="f">
                        <th></th>
                        <th><div class="flt-w"><i class="fa fa-search"></i><input class="flt" data-f="name" placeholder="Name / brand"></div></th>
                        <th><div class="flt-w"><i class="fa fa-tag"></i><input class="flt" data-f="sku" placeholder="SKU"></div></th>
                        <th><div class="flt-w"><i class="fa fa-barcode"></i><input class="flt" data-f="barcode" placeholder="Barcode"></div></th>
                        <th><div class="flt-w"><i class="fa fa-tint"></i><input class="flt" data-f="colour" placeholder="Colour"></div></th>
                        <th><div class="flt-w"><i class="fa fa-arrows-h"></i><input class="flt" data-f="size" placeholder="Size" style="max-width:80px"></div></th>
                        <th></th><th></th><th></th>
                    </tr>
                </thead>
                <tbody id="lgBody"></tbody>
            </table>
        </div>
        <div class="dw-ft">
            <div class="p-sum" id="dwSum"></div>
            <div class="basket" id="dwBasket"></div>
            <div class="sp"></div>
            <button class="btn ghost" id="dwClear">Clear</button>
            <button class="btn pri" id="dwAdd"><i class="fa fa-plus"></i> Add to items</button>
        </div>
    </aside>
</div>

<div class="toast" id="toast"><i class="fa fa-check-circle"></i><span></span></div>

<script>
/* ------------------------------------------------------------- sample data */
const FAMILIES = [
    { id: 'f1', name: 'Adidas 4D Run', brand: 'Adidas', cat: 'Footwear', code: '4297', cost: 280, mrp: 500,
      colours: [['White Green', '#d9e8d6', '#3f8f5a'], ['Core Black', '#2b2c31', '#111214'], ['Cloud Grey', '#d3d6db', '#8f96a0']],
      sizes: ['40', '41', '42', '43', '44', '45'], missing: ['Core Black|45', 'Cloud Grey|40'] },
    { id: 'f2', name: 'Onitsuka Mexico 66', brand: 'Onitsuka Tiger', cat: 'Footwear', code: '5531', cost: 210, mrp: 420,
      colours: [['Kill Bill Yellow', '#f6d04d', '#c99a12'], ['Birch / Peacoat', '#ece4d0', '#2c3e64'], ['Black / White', '#2a2a2e', '#d9d9d9']],
      sizes: ['37', '38', '39', '40', '41', '42', '43', '44'], missing: ['Kill Bill Yellow|37', 'Black / White|44'] },
    { id: 'f3', name: "Nike Air Force 1 '07", brand: 'Nike', cat: 'Footwear', code: '6102', cost: 320, mrp: 560,
      colours: [['Triple White', '#f4f4f4', '#cfd3d8'], ['Triple Black', '#202124', '#000']],
      sizes: ['39', '40', '41', '42', '43', '44', '45'], missing: [] },
    { id: 'f4', name: 'Essentials Logo Tee', brand: 'Adidas', cat: 'Apparel', code: '7720', cost: 38, mrp: 89,
      colours: [['Navy', '#2d3a5c', '#18203a'], ['White', '#f6f6f6', '#d4d4d4'], ['Olive', '#7a8450', '#4f5733'], ['Rose', '#f0b7c1', '#c76f80']],
      sizes: ['S', 'M', 'L', 'XL', 'XXL'], missing: ['Rose|XXL'] },
];
const SINGLES = [
    { id: 's1', name: '`crybaby shiny shiny pendant', mrp: 200, cost: 200, barcode: '7884', code: '850633', stock: 4 },
    { id: 's2', name: '`crybaby shiny shiny400 pink', mrp: 480, cost: 250, barcode: '7881', code: '806510', stock: 2 },
    { id: 's3', name: '9999', mrp: 4, cost: 2, barcode: '2664', code: '2664', stock: 31 },
    { id: 's4', name: 'Adidas 30', mrp: 30, cost: 25, barcode: '7037', code: '609074', stock: 0 },
];
const hash = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
const VARIANTS = [];
FAMILIES.forEach(f => {
    f.variants = [];
    f.colours.forEach(([colour, a, b], ci) => f.sizes.forEach((size, si) => {
        if (f.missing.includes(colour + '|' + size)) { return; }
        const h = hash(f.id + colour + size);
        const v = { id: `${f.id}-${ci}-${si}`, fam: f, colour, a, b, size, cost: f.cost, mrp: f.mrp,
            code: `${f.code}-${colour.split(/[ /]+/).map(w => w[0]).join('').toUpperCase()}-${size}`,
            barcode: String(1000 + (h % 8999)), stock: h % 9 === 0 ? 0 : h % 7 };
        f.variants.push(v); VARIANTS.push(v);
    }));
});
const fam = id => FAMILIES.find(f => f.id === id);
const variantOf = (f, colour, size) => f.variants.find(v => v.colour === colour && v.size === size);
const fmt = n => Number(n).toLocaleString('en', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const initials = n => n.replace(/[^A-Za-z0-9 ]/g, '').split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const thumb = (f, cls = '') => `<div class="thumb ${cls}" style="--a:${f.colours[0][1]};--b:${f.colours[0][2]}">${esc(initials(f.name))}</div>`;
const vThumb = (v, cls = '') => `<div class="thumb ${cls}" style="--a:${v.a};--b:${v.b}">${esc(v.size)}</div>`;
const sw = (c, cls = '') => `<span class="sw ${cls}" style="--c:${c}"></span>`;
const stockCls = s => s === 0 ? 'out' : s < 3 ? 'low' : '';
const sortedFamilyText = f => `${f.colours.length} colours · ${f.sizes.length} sizes · ${f.variants.length} variants`;

/* ------------------------------------------------------------------ cart */
let cart = [];
let flashKeys = new Set();
function addLine(item, qty, cost) {
    const found = cart.find(l => l.item.id === item.id);
    if (found) { found.qty += qty; found.cost = cost ?? found.cost; }
    else { cart.push({ item, qty, cost: cost ?? item.cost }); }
    flashKeys.add(item.id);
}
function renderCart() {
    const body = document.getElementById('cart');
    document.getElementById('lineCount').textContent = `${cart.length} ${cart.length === 1 ? 'line' : 'lines'}`;
    if (!cart.length) {
        body.innerHTML = `<tr><td colspan="6"><div class="pcx-empty"><i class="fa fa-cubes"></i><div class="t">No items yet</div><div>Scan a barcode, search a product, or add a whole family.</div></div></td></tr>`;
        document.getElementById('cartFoot').innerHTML = '';
        return;
    }
    let rows = '', lastFam = null, i = 0;
    cart.forEach((l, idx) => {
        const it = l.item;
        const famId = it.fam ? it.fam.id : null;
        if (famId && famId !== lastFam) {
            const lines = cart.filter(x => x.item.fam && x.item.fam.id === famId);
            rows += `<tr class="fam-sep"><td></td><td colspan="5"><i class="fa fa-sitemap"></i>&nbsp; ${esc(it.fam.name)} · ${lines.length} variants · ${lines.reduce((s, x) => s + x.qty, 0)} pcs</td></tr>`;
        }
        lastFam = famId;
        i++;
        rows += `<tr class="${flashKeys.has(it.id) ? 'flash' : ''}">
            <td><div class="pcx-idx">${i}</div></td>
            <td><h6 class="pcx-pname">${esc(it.fam ? it.fam.name : it.name)}</h6>
                <div class="pcx-pbar">${esc(it.barcode)} · ${esc(it.code)}</div>
                ${it.fam ? `<div class="pcx-pvar">${sw(it.a)} ${esc(it.colour)} · Size ${esc(it.size)}</div>` : ''}</td>
            <td class="e"><input class="pcx-cell" type="number" value="${l.cost}" data-cost="${idx}"></td>
            <td class="e"><input class="pcx-cell" type="number" value="${l.qty}" data-qty="${idx}"></td>
            <td class="pcx-rtot">${fmt(l.cost * l.qty)}</td>
            <td><button class="iconbtn" data-del="${idx}" title="Remove"><i class="fa fa-trash-o"></i></button></td>
        </tr>`;
    });
    body.innerHTML = rows;
    flashKeys = new Set();
    const tq = cart.reduce((s, l) => s + l.qty, 0), ta = cart.reduce((s, l) => s + l.qty * l.cost, 0);
    document.getElementById('cartFoot').innerHTML = `<tr><td colspan="3" class="lab">Totals</td><td>${tq}</td><td>${fmt(ta)}</td><td></td></tr>`;
}
document.getElementById('cart').addEventListener('click', e => {
    const d = e.target.closest('[data-del]');
    if (d) { cart.splice(+d.dataset.del, 1); renderCart(); }
});
document.getElementById('cart').addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.qty) { cart[+t.dataset.qty].qty = Math.max(0, +t.value || 0); renderCart(); }
    if (t.dataset.cost) { cart[+t.dataset.cost].cost = Math.max(0, +t.value || 0); renderCart(); }
});

function toast(msg) {
    const t = document.getElementById('toast');
    t.querySelector('span').textContent = msg;
    t.classList.add('on');
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove('on'), 1800);
}

/* ------------------------------------------------------- direction state */
let dir = 'A';
let aMode = 'item';
const NOTES = {
    A: `<b>A · Size-run Matrix</b>: the field gets an <b>Item / Family</b> toggle. In Family mode you search families, and picking one opens a colour × size grid right under the field. Type quantities straight into the cells (Tab moves across). Tap a <b>size header</b> to add 1 to that whole size, or a <b>colour name</b> to add 1 to that whole row. Cost and MRP are set once for the family. One <b>Add</b> creates every line. Hatched cells are combinations that don't exist in the family. Each cell shows current stock, so you can see what to reorder.
        <div class="tags"><span>Best for buying a full size run</span><span>Fastest when typing</span><span>Everything inline, no modal</span></div>`,
    B: `<b>B · Catalogue Ledger</b>: a <b>Browse catalogue</b> button (F2) beside the dropdown opens a drawer laid out like the product list. Each column has its own filter: <b>Name, SKU, Barcode, Colour, Size</b>. Families are grouped rows: expand one, or filter by SKU/colour/size and the matching variants open automatically. Type an order qty on any row, or on the family row to fill every visible variant. Your picks collect in the footer basket across searches, then <b>Add to items</b> once.
        <div class="tags"><span>Best for mixed orders across many families</span><span>Search by SKU or barcode per column</span><span>Feels like the product list</span></div>`,
    C: `<b>C · Chip Composer</b>: no extra buttons. The same dropdown shows <b>Families</b> above single items. Picking a family opens a guided strip: <b>1 colours</b> (tap one or more) → <b>2 sizes</b> (tap keys, or use a range like 40–44) → <b>3 qty & cost</b>. Before you add, you see every line it will create; adjust or remove any of them, and combinations that don't exist are shown struck through.
        <div class="tags"><span>Best for touch / tablet</span><span>Fewest decisions per step</span><span>One search field for everything</span></div>`,
};

function setDir(d) {
    dir = d;
    document.querySelectorAll('#dirSeg button').forEach(b => b.classList.toggle('on', b.dataset.dir === d));
    document.getElementById('note').innerHTML = NOTES[d];
    closePanel();
    const lead = document.getElementById('entryLead'), tail = document.getElementById('entryTail');
    lead.innerHTML = ''; tail.innerHTML = '';
    if (d === 'A') {
        lead.innerHTML = `<div class="mode" id="aMode"><button data-m="item" class="${aMode === 'item' ? 'on' : ''}"><i class="fa fa-cube"></i> Item</button><button data-m="family" class="${aMode === 'family' ? 'on' : ''}"><i class="fa fa-sitemap"></i> Family</button></div>`;
        lead.querySelectorAll('button').forEach(b => b.onclick = () => { aMode = b.dataset.m; setDir('A'); q.focus(); });
    }
    if (d === 'B') {
        tail.innerHTML = `<button class="btn" id="openDw"><i class="fa fa-th-list"></i> Browse catalogue <span class="kbd">F2</span></button>`;
        document.getElementById('openDw').onclick = openDrawer;
    }
    q.placeholder = d === 'A' && aMode === 'family' ? 'Search a family — name, brand or style code…'
        : d === 'C' ? 'Scan barcode, search a product or a family…' : 'Scan barcode or search product…';
}

/* ---------------------------------------------- the existing dropdown */
const q = document.getElementById('q'), dd = document.getElementById('dd');
const match = (hay, needle) => needle.toLowerCase().split(/\s+/).filter(Boolean).every(t => hay.toLowerCase().includes(t));
function itemRow(it) {
    const chips = [`<span class="chip"><b>MRP:</b> ${it.mrp}</span>`, `<span class="chip"><b>Cost:</b> ${it.cost}</span>`, `<span class="chip"><b>Barcode:</b> ${esc(it.barcode)}</span>`];
    if (it.fam) { chips.push(`<span class="chip"><b>Size:</b> ${esc(it.size)}</span>`, `<span class="chip"><b>Colour:</b> ${esc(it.colour)}</span>`); }
    chips.push(`<span class="chip"><b>Code:</b> ${esc(it.code)}</span>`);
    return `<div class="dd-row" data-item="${it.id}">${it.fam ? vThumb(it) : `<div class="thumb plain">${esc(initials(it.name) || '#')}</div>`}
        <div><div class="nm">${esc(it.fam ? it.fam.name : it.name)}</div><div class="meta">${chips.join('')}</div></div></div>`;
}
function famRow(f) {
    return `<div class="dd-row" data-fam="${f.id}">${thumb(f)}
        <div><div class="nm">${esc(f.name)}</div><div class="meta">
            <span class="chip acc"><i class="fa fa-sitemap"></i> Family</span>
            <span class="chip"><b>Style:</b> ${esc(f.code)}</span>
            <span class="chip">${f.colours.map(c => sw(c[1])).join(' ')} ${f.colours.length} colours</span>
            <span class="chip"><b>Sizes:</b> ${esc(f.sizes[0])}–${esc(f.sizes[f.sizes.length - 1])}</span>
            <span class="chip"><b>Cost:</b> ${f.cost}</span></div></div>
        <span class="go">Pick sizes <i class="fa fa-angle-right"></i></span></div>`;
}
function renderDD() {
    const term = q.value.trim();
    const items = [...SINGLES, ...VARIANTS].filter(it => match([it.name || it.fam.name, it.code, it.barcode, it.colour || '', it.size || ''].join(' '), term)).slice(0, 8);

const hl = (text, term) => {

const has = (v, t) => !t || String(v).toLowerCase().includes(t.toLowerCase());

function renderLedger() {

    document.getElementById('dwAdd').disabled = !all.length;
}
function setFamQty(fid, n) { variantRowsFor(fam(fid)).forEach(v => n ? dw.qty[v.id] = n : delete dw.qty[v.id]); dw.open.add(fid); }
document.getElementById('lgBody').addEventListener('click', e => {

    panel.querySelector('#ccAdd').onclick = () => {
        live.forEach(l => addLine(l.v, cc.over[l.v.id] ?? cc.qty, cc.cost));
        const name = f.name;
        renderCart(); closePanel(); toast(`${name}: ${live.length} ${live.length === 1 ? "line" : "lines"} · ${pcs} pcs added`); q.focus();
    };
}
let lastSize = null;
panel.addEventListener('click', e => {
    if (!cc) { return; }
    const b = e.target.closest('button'); if (!b) { return; }
    const d = b.dataset, f = cc.f;
    if (d.c) { cc.cols.has(d.c) ? cc.cols.delete(d.c) : cc.cols.add(d.c); }
    if ('allc' in d) { f.colours.forEach(([c]) => cc.cols.add(c)); }
    if ('nonec' in d) { cc.cols.clear(); }
    if (d.s) {
        if (e.shiftKey && lastSize) {
            const i = f.sizes.indexOf(lastSize), j = f.sizes.indexOf(d.s);
            f.sizes.slice(Math.min(i, j), Math.max(i, j) + 1).forEach(s => cc.sizes.add(s));
        } else { cc.sizes.has(d.s) ? cc.sizes.delete(d.s) : cc.sizes.add(d.s); }
        lastSize = d.s;
    }
    if ('alls' in d) { f.sizes.forEach(s => cc.sizes.add(s)); }
    if ('nones' in d) { cc.sizes.clear(); }
    if ('mid' in d) { cc.sizes.clear(); const n = f.sizes.length; f.sizes.slice(Math.floor(n * .2), Math.ceil(n * .8)).forEach(s => cc.sizes.add(s)); }
    if (d.inc === 'ccq') { cc.qty++; }
    if (d.dec === 'ccq') { cc.qty = Math.max(1, cc.qty - 1); }
    if (d.li) { cc.over[d.li] = (cc.over[d.li] ?? cc.qty) + 1; }
    if (d.ld) { const n = (cc.over[d.ld] ?? cc.qty) - 1; n <= 0 ? cc.skip.add(d.ld) : cc.over[d.ld] = n; }
    if (d.lx) { cc.skip.add(d.lx); }
    if (b.id !== 'ccAdd' && b.id !== 'ccClose') { renderComposer(); }
});
panel.addEventListener('change', e => { if (cc && e.target.dataset.set === 'ccq') { cc.qty = Math.max(1, +e.target.value || 1); renderComposer(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && cc) { closePanel(); } });

/* ------------------------------------------------------------ harness */
document.querySelectorAll('#dirSeg button').forEach(b => b.onclick = () => setDir(b.dataset.dir));
document.querySelectorAll('#themeSeg button').forEach(b => b.onclick = () => {
    document.documentElement.setAttribute('data-bs-theme', b.dataset.theme);
    document.querySelectorAll('#themeSeg button').forEach(x => x.classList.toggle('on', x === b));
});
document.querySelectorAll('#accents button').forEach(b => b.onclick = () => {
    document.documentElement.style.setProperty('--bs-primary', b.dataset.c);
    document.documentElement.style.setProperty('--bs-primary-rgb', b.dataset.rgb);
    document.querySelectorAll('#accents button').forEach(x => x.classList.toggle('on', x === b));
});

setDir('A');
addLine(SINGLES[0], 1);
renderCart();
</script>
</body>

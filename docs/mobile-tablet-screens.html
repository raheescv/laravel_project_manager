<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>invo — Tablet Layouts (all screens except New Sale)</title>
<style>
:root{
  --bg:#FBF8F1; --card:#ffffff; --ink:#16312A; --muted:#5D7269; --faint:#A8B3AB;
  --line:#F0ECE1; --gold:#BF953F; --emerald:#15806C; --emerald-d:#0E5648;
  --chip:#E6F0EC; --success:#1F9D63; --danger:#D4546A;
  --warn-bg:#FBF3DF; --warn-ink:#9A6A00; --succ-bg:#E4F6EC; --dang-bg:#FBE9EC;
  --recess:#F4EFE6; --hero-a:#2f5d4f; --hero-b:#1c4a3b; --rail:#0A1B17;
  --shadow:0 14px 34px -22px rgba(9,30,22,.4);
}
[data-theme="dark"]{
  --bg:#07140F; --card:#15302A; --ink:#F3F1EA; --muted:#A9C2BA; --faint:#7C9189;
  --line:rgba(255,255,255,.10); --gold:#D9B25E; --emerald:#2AA98C; --emerald-d:#0E5648;
  --chip:rgba(42,169,140,.16); --success:#3FC585; --danger:#E06A7E;
  --warn-bg:rgba(201,162,75,.18); --warn-ink:#E6C16B; --succ-bg:rgba(31,157,99,.16); --dang-bg:rgba(212,84,106,.18);
  --recess:#0F231D; --hero-a:#123f33; --hero-b:#07140F; --rail:#050F0B; --shadow:0 18px 40px -24px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;transition:.25s}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 22px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:18px}.brand .i{color:var(--gold)}
.sub{color:var(--muted);font-size:12px}.spacer{flex:1}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:2px;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:12px;padding:7px 12px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--emerald);color:#fff}
.toggle{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:8px 13px;font-weight:700;font-size:12px;cursor:pointer}
.hint{max-width:1180px;margin:18px auto 0;padding:0 22px;color:var(--muted);font-size:13.5px;line-height:1.6}
.hint b{color:var(--ink)}
.note{max-width:1180px;margin:6px auto 0;padding:0 22px;color:var(--faint);font-size:12.5px}

.stage{max-width:1180px;margin:14px auto 60px;padding:0 22px}
.device{position:relative;background:var(--rail);border-radius:28px;padding:13px;box-shadow:0 40px 90px -40px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.06)}
.device::after{content:"";position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:4px;height:60px;background:#0006;border-radius:3px}
.screen{background:var(--bg);border-radius:16px;overflow:hidden;height:700px;display:flex}
.tag{position:absolute;top:-11px;left:24px;background:var(--gold);color:#1c1608;font-size:11px;font-weight:800;letter-spacing:.4px;padding:4px 12px;border-radius:20px}

/* side rail */
.rail{width:88px;background:linear-gradient(180deg,var(--hero-a),var(--rail));display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:5px;color:#dfeee7}
.rail .logo{width:38px;height:38px;border-radius:11px;border:1px solid #ffffff33;display:grid;place-items:center;font-family:serif;font-size:19px;color:var(--gold);margin-bottom:12px}
.ritem{width:62px;padding:10px 0;border-radius:13px;text-align:center;font-size:10px;font-weight:700;color:#cfe4db;display:flex;flex-direction:column;align-items:center;gap:4px;opacity:.8}
.ritem .ic{font-size:16px}.ritem.on{background:#ffffff1f;color:#fff;opacity:1}
.rail .grow{flex:1}
.fab{width:50px;height:50px;border-radius:50%;background:var(--gold);color:#241c08;display:grid;place-items:center;font-size:23px;font-weight:800}

.pane{flex:1;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.scroll{overflow:auto;padding:20px 24px}
.sect{font-size:11px;letter-spacing:1.3px;font-weight:800;color:var(--emerald);text-transform:uppercase;margin:6px 2px 12px}
[data-theme="dark"] .sect{color:var(--gold)}
.pagehead{display:flex;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--line)}
.pagehead h2{margin:0;font-size:21px;font-weight:800}
.pagehead .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 15px;font-weight:700;font-size:13px}
.btn.pri{background:var(--emerald);color:#fff;border-color:transparent}

/* generic cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.kpi{padding:18px}.kpi .row{display:flex;justify-content:space-between;align-items:center}
.chip{width:38px;height:38px;border-radius:12px;background:var(--chip);color:var(--emerald);display:grid;place-items:center}
.pill{font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:20px}
.pill.up{background:var(--succ-bg);color:var(--success)}.pill.down{background:var(--dang-bg);color:var(--danger)}
.kpi .val{font-size:27px;font-weight:800;margin-top:12px}.kpi .cap{color:var(--faint);font-size:12px}

/* hero (dashboard) */
.hero{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#eafaf3;border-radius:18px;padding:20px 22px;margin-bottom:18px;position:relative}
.hero .greet{font-size:10.5px;letter-spacing:1.4px;font-weight:800;color:var(--gold);text-transform:uppercase}
.hero .name{font-size:24px;font-weight:700;margin-top:2px}
.hero .rl{font-size:10.5px;letter-spacing:1px;color:#bfd8ce;margin-top:14px;text-transform:uppercase}
.hero .rev{font-size:36px;font-weight:800;margin-top:2px}
.hero .avatar{position:absolute;top:20px;right:22px;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;font-weight:700;color:#fff}
.qa{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 10px;text-align:center;box-shadow:var(--shadow)}
.qcard .ic{width:42px;height:42px;border-radius:13px;background:var(--chip);color:var(--emerald);display:grid;place-items:center;font-size:18px;margin:0 auto 8px}
.qcard.gold .ic{background:#f6ecd4;color:var(--gold)}
[data-theme="dark"] .qcard.gold .ic{background:rgba(217,178,94,.16)}
.qcard b{font-size:12.5px}

/* master–detail */
.listcol{width:330px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--card)}
.lc-head{padding:16px 16px 12px}.lc-title{font-size:19px;font-weight:800}
.search{margin-top:12px;background:var(--recess);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--faint);font-size:13px}
.filters{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.fchip{font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:20px;background:var(--recess);color:var(--muted);border:1px solid var(--line)}
.fchip.on{background:var(--emerald);color:#fff;border-color:transparent}
.rows{overflow:auto;flex:1}
.lrow{padding:13px 16px;border-bottom:1px solid var(--line)}.lrow.on{background:var(--chip)}
.lrow .t{display:flex;justify-content:space-between}.lrow .inv{font-weight:700;font-size:14px}.lrow .amt{font-weight:800;font-size:14px}
.lrow .s{color:var(--muted);font-size:12px;margin-top:3px;display:flex;justify-content:space-between}
.badge{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:20px;background:var(--succ-bg);color:var(--success)}
.badge.draft{background:var(--warn-bg);color:var(--warn-ink)}.badge.ret{background:var(--dang-bg);color:var(--danger)}
.detail{flex:1;overflow:auto;padding:24px 28px}
.d-head{display:flex;justify-content:space-between;align-items:flex-start}
.d-inv{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.5px}
.d-amt{font-size:34px;font-weight:800;margin-top:4px}.d-sub{color:var(--muted);font-size:13px;margin-top:2px}
.d-actions{display:flex;gap:10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:18px;box-shadow:var(--shadow)}
.panel h4{margin:0 0 12px;font-size:11.5px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.line:last-child{border-bottom:0}.line .q{color:var(--muted)}
.tot{display:flex;justify-content:space-between;padding-top:12px;margin-top:6px;border-top:1px solid var(--line);font-weight:800;font-size:16px}

/* settings two-pane */
.setnav{width:280px;border-right:1px solid var(--line);background:var(--card);overflow:auto;padding:12px}
.snav{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:13px;font-size:14px;font-weight:600;color:var(--ink)}
.snav .ic{width:34px;height:34px;border-radius:10px;background:var(--recess);display:grid;place-items:center;color:var(--muted);font-size:16px}
.snav.on{background:var(--chip)}.snav.on .ic{background:var(--emerald);color:#fff}
.snav small{display:block;color:var(--faint);font-size:11.5px;font-weight:500}
.setbody{flex:1;overflow:auto;padding:26px 30px}
.field{margin-bottom:18px}.field label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.4px}
.field .inp{margin-top:6px;background:var(--recess);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--ink)}
.switch{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:14px;margin-bottom:12px;background:var(--card)}
.switch b{font-size:14px}.switch small{color:var(--muted);font-size:12px}
.knob{width:46px;height:27px;border-radius:20px;background:var(--emerald);position:relative}
.knob::after{content:"";position:absolute;right:3px;top:3px;width:21px;height:21px;border-radius:50%;background:#fff}
.knob.off{background:var(--line)}.knob.off::after{left:3px;right:auto}

/* stock check */
.stockgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.scell{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.scell .nm{font-size:13px;font-weight:700}.scell .code{font-size:11px;color:var(--faint)}
.scell .cr{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.scell .qn{font-size:20px;font-weight:800;color:var(--emerald)}
.scell .step{display:flex;gap:6px}.scell .step b{width:26px;height:26px;border-radius:8px;background:var(--recess);border:1px solid var(--line);display:grid;place-items:center;color:var(--emerald)}
.sidepanel{width:300px;border-left:1px solid var(--line);background:var(--card);padding:20px}

/* day session centered */
.centered{flex:1;display:grid;place-items:center;padding:30px}
.daycard{width:520px;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:var(--shadow)}
.daycard .big{font-size:30px;font-weight:800}
.timeline{margin-top:20px;border-left:2px solid var(--line);padding-left:18px}
.tl{margin-bottom:16px;position:relative}.tl::before{content:"";position:absolute;left:-25px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--emerald)}
.tl b{font-size:14px}.tl small{color:var(--muted);font-size:12px;display:block}

@media(max-width:820px){
  .screen{height:auto;flex-direction:column}
  .rail{width:100%;flex-direction:row;height:60px;padding:0 12px}.rail .logo,.rail .grow{display:none}
  .qa{grid-template-columns:repeat(3,1fr)}.grid3,.grid2{grid-template-columns:1fr}
  .listcol,.setnav,.sidepanel,.setbody{width:100%}
}
</style>
</head>
<body data-theme="light">
<div class="topbar">
  <div class="brand"><span class="i">ı</span> invo</div>
  <div class="sub">Tablet layouts</div>
  <div class="spacer"></div>
  <div class="seg" id="screens">
    <button class="on" data-s="dash">Home</button>
    <button data-s="sales">Sales</button>
    <button data-s="returns">Returns</button>
    <button data-s="reports">Reports</button>
    <button data-s="settings">Settings</button>
    <button data-s="stock">Stock Check</button>
    <button data-s="day">Day Session</button>
  </div>
  <button class="toggle" id="tt">◐ Dark</button>
</div>

<div class="hint" id="hint"></div>
<div class="note">New Sale is intentionally excluded — it keeps its current design. Phones fall through to the existing single-column layouts unchanged.</div>

<div class="stage">
  <div class="device"><div class="tag" id="tag">iPad · landscape</div><div class="screen" id="screen"></div></div>
</div>

<script>
const rail=(a)=>`<div class="rail"><div class="logo">ı</div>
  ${[['home','⊞','Home'],['sales','🧾','Sales'],['reports','📊','Reports'],['settings','⚙','Settings']]
    .map(([k,ic,l])=>`<div class="ritem ${k===a?'on':''}"><span class="ic">${ic}</span>${l}</div>`).join('')}
  <div class="grow"></div><div class="fab">+</div></div>`;

const dash=()=>`${rail('home')}<div class="pane"><div class="scroll">
  <div class="hero"><div class="avatar">H</div><div class="greet">Good evening,</div>
    <div class="name serif">hasif</div><div class="rl">Today's revenue</div>
    <div class="rev serif">QAR 3,990.00</div></div>
  <div class="sect">Quick Actions</div>
  <div class="qa">
    <div class="qcard gold"><div class="ic">🛒</div><b>New Sale</b></div>
    <div class="qcard"><div class="ic">🧾</div><b>Sales</b></div>
    <div class="qcard"><div class="ic">↩</div><b>Returns</b></div>
    <div class="qcard"><div class="ic">📊</div><b>Reports</b></div>
    <div class="qcard"><div class="ic">🕐</div><b>Day Session</b></div>
  </div>
  <div class="sect">Insights</div>
  <div class="grid3">
    <div class="card kpi"><div class="row"><div class="chip">▦</div><span class="pill up">↗ 100%</span></div><div class="val serif">QAR 3,990</div><div class="cap">This week</div></div>
    <div class="card kpi"><div class="row"><div class="chip">📅</div><span class="pill down">↘ -93%</span></div><div class="val serif">QAR 3,990</div><div class="cap">This month</div></div>
    <div class="card kpi"><div class="row"><div class="chip">💳</div><span class="pill up">↗ Cash</span></div><div class="val serif">QAR 3,990</div><div class="cap">Session payments</div></div>
  </div>
</div></div>`;

const md=(title,rows,detail)=>`${rail(title==='Sales'?'sales':'home')}
  <div class="listcol"><div class="lc-head"><div class="lc-title">${title}</div>
    <div class="search">🔍  Search…</div>
    <div class="filters"><span class="fchip on">All</span><span class="fchip">${title==='Returns'?'Completed':'Paid'}</span><span class="fchip">Draft</span><span class="fchip">Today ▾</span></div></div>
    <div class="rows">${rows}</div></div>
  <div class="detail">${detail}</div>`;

const sales=()=>md('Sales',
  [['INV-1042','QAR 3,990.00','Walk-in · 4:12 PM','paid','on'],
   ['INV-1041','QAR 640.00','Sara M. · 2:03 PM','paid',''],
   ['INV-1040','QAR 210.00','Walk-in · 1:22 PM','draft','draft'],
   ['INV-1039','QAR 1,180.00','Ahmed K. · 12:40 PM','paid','']]
   .map(([i,a,s,b,on])=>`<div class="lrow ${on}"><div class="t"><span class="inv">${i}</span><span class="amt">${a}</span></div><div class="s"><span>${s}</span><span class="badge ${b==='draft'?'draft':''}">${b}</span></div></div>`).join(''),
  `<div class="d-head"><div><div class="d-inv">INVOICE · INV-1042</div><div class="d-amt serif">QAR 3,990.00</div><div class="d-sub">Walk-in · 26 Jul 2026, 4:12 PM · Cash</div></div>
     <div class="d-actions"><button class="btn">Print</button><button class="btn">Return</button><button class="btn pri">Edit</button></div></div>
   <div class="panel"><h4>Items</h4><div class="line"><span><span class="q">2 ×</span> Silk Abaya — Onyx</span><span>QAR 3,600.00</span></div><div class="line"><span><span class="q">1 ×</span> Perfume Oil 12ml</span><span>QAR 390.00</span></div><div class="tot"><span>Grand total</span><span>QAR 3,990.00</span></div></div>
   <div class="panel"><h4>Payment</h4><div class="line"><span class="q">Cash</span><span>QAR 3,990.00</span></div></div>`);

const returns=()=>md('Returns',
  [['RET-208','− QAR 390.00','Against INV-1039 · 3:01 PM','ret','on'],
   ['RET-207','− QAR 120.00','Against INV-1031 · Yest.','ret',''],
   ['RET-206','− QAR 60.00','Against INV-1028 · Yest.','draft','draft']]
   .map(([i,a,s,b,on])=>`<div class="lrow ${on}"><div class="t"><span class="inv">${i}</span><span class="amt">${a}</span></div><div class="s"><span>${s}</span><span class="badge ${b==='draft'?'draft':'ret'}">${b==='draft'?'draft':'returned'}</span></div></div>`).join(''),
  `<div class="d-head"><div><div class="d-inv">RETURN · RET-208</div><div class="d-amt serif">− QAR 390.00</div><div class="d-sub">Against INV-1039 · Ahmed K. · Refund to Cash</div></div>
     <div class="d-actions"><button class="btn">Print</button><button class="btn pri">Edit</button></div></div>
   <div class="panel"><h4>Returned items</h4><div class="line"><span><span class="q">1 ×</span> Perfume Oil 12ml</span><span>QAR 390.00</span></div><div class="tot"><span>Refund total</span><span>QAR 390.00</span></div></div>`);

const reports=()=>`${rail('reports')}<div class="pane">
  <div class="pagehead"><h2>Reports</h2><div class="sp"></div>
    <button class="btn">This month ▾</button><button class="btn">Itemwise ▾</button><button class="btn pri">Export</button></div>
  <div class="scroll">
    <div class="grid3" style="margin-bottom:16px">
      <div class="card kpi"><div class="cap">Total sales</div><div class="val serif">QAR 48,920</div><span class="pill up">↗ 12%</span></div>
      <div class="card kpi"><div class="cap">Bills</div><div class="val serif">214</div><span class="pill up">↗ 8%</span></div>
      <div class="card kpi"><div class="cap">Avg ticket</div><div class="val serif">QAR 228</div><span class="pill down">↘ 3%</span></div>
    </div>
    <div class="grid2">
      <div class="panel" style="margin-top:0"><h4>Revenue by day</h4>
        <div style="display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:8px">
          ${[40,70,55,90,60,110,80].map(h=>`<div style="flex:1;background:var(--emerald);border-radius:6px 6px 0 0;height:${h}px;opacity:.85"></div>`).join('')}</div></div>
      <div class="panel" style="margin-top:0"><h4>Top items</h4>
        ${[['Silk Abaya','QAR 12,400'],['Perfume Oil','QAR 6,210'],['Kaftan Set','QAR 4,050'],['Bakhoor Box','QAR 2,900']]
          .map(([n,v])=>`<div class="line"><span>${n}</span><span>${v}</span></div>`).join('')}</div>
    </div>
  </div></div>`;

const settings=()=>`${rail('settings')}
  <div class="setnav">
    ${[['🏬','Business profile','Name, logo, tax',''],['🧾','Sale configuration','Default type, tips, print','on'],
       ['🖨','Receipt & printing','Paper width, footer',''],['💱','Currencies','Base + rates',''],
       ['👥','Users & staff','Roles, PIN',''],['🎨','Appearance','Theme, skin',''],['🕐','Day session','Open/close rules','']]
      .map(([ic,t,s,on])=>`<div class="snav ${on}"><div class="ic">${ic}</div><div>${t}<small>${s}</small></div></div>`).join('')}
  </div>
  <div class="setbody">
    <h2 style="margin:0 0 4px;font-size:21px">Sale configuration</h2>
    <div style="color:var(--muted);font-size:13px;margin-bottom:22px">Defaults applied to every new ticket.</div>
    <div class="switch"><div><b>Enable tips</b><br><small>Show a tip line at payment</small></div><div class="knob"></div></div>
    <div class="switch"><div><b>Ask client on start</b><br><small>Prompt for client when a ticket opens</small></div><div class="knob"></div></div>
    <div class="switch"><div><b>Allow negative stock</b><br><small>Sell items with zero on hand</small></div><div class="knob off"></div></div>
    <div class="grid2" style="margin-top:8px">
      <div class="field"><label>Default catalog type</label><div class="inp">Products ▾</div></div>
      <div class="field"><label>Default quantity</label><div class="inp">1</div></div>
    </div>
  </div>`;

const stock=()=>`${rail('home')}<div class="pane">
  <div class="pagehead"><h2>Stock Check · #SC-14</h2><div class="sp"></div><button class="btn">Scan ▣</button><button class="btn pri">Reconcile all</button></div>
  <div style="display:flex;flex:1;min-height:0">
    <div class="scroll" style="flex:1">
      <div class="stockgrid">
        ${[['Silk Abaya','SA-01',12],['Perfume Oil','PO-12',30],['Kaftan Set','KF-03',8],['Cotton Shayla','CS-07',22],
           ['Prayer Set','PR-02',15],['Bakhoor Box','BK-09',6],['Beaded Clutch','BC-04',11],['Hair Clip','HC-05',40]]
          .map(([n,c,q])=>`<div class="scell"><div class="nm">${n}</div><div class="code">${c}</div>
            <div class="cr"><div class="qn">${q}</div><div class="step"><b>−</b><b>+</b></div></div></div>`).join('')}
      </div>
    </div>
    <div class="sidepanel">
      <div class="sect">Progress</div>
      <div class="card kpi" style="margin-bottom:12px"><div class="cap">Counted</div><div class="val serif">18 / 128</div></div>
      <div class="switch"><div><b>Variance</b><br><small>vs system on hand</small></div><b style="color:var(--danger)">− 4</b></div>
      <button class="btn pri" style="width:100%;margin-top:10px">Finish count</button>
    </div>
  </div></div>`;

const day=()=>`${rail('home')}<div class="pane"><div class="centered">
  <div class="daycard">
    <div class="sect">Day Session</div>
    <div class="big serif">Day is closed</div>
    <div style="color:var(--muted);font-size:13.5px;margin-top:4px">Open the day to start billing.</div>
    <div class="timeline">
      <div class="tl"><b>Opening balance</b><small>QAR 500.00 · cash drawer #2</small></div>
      <div class="tl"><b>Last closed</b><small>26 Jul 2026 · 2:56 PM by hasif</small></div>
      <div class="tl"><b>Date &amp; time</b><small>27 Jul 2026 · now</small></div>
    </div>
    <button class="btn pri" style="width:100%;margin-top:20px;padding:14px">Open day session</button>
  </div>
</div></div>`;

const views={dash,sales,returns,reports,settings,stock,day};
const hints={
  dash:`<b>Home.</b> Persistent left <b>side-rail</b> instead of the bottom nav; hero stays a capped column, Quick Actions 5-across, Insights a 3-up grid.`,
  sales:`<b>Sales — master–detail.</b> List pinned left, selected invoice opens in a right detail pane (no full-screen push). Narrow tablets fall back to single-pane.`,
  returns:`<b>Returns — master–detail.</b> Same two-pane pattern as Sales; pick a return on the left, see its items/refund on the right.`,
  reports:`<b>Reports.</b> Filters move into a top action row; KPIs go 3-up and charts/tables sit side-by-side in a 2-column grid to use the width.`,
  settings:`<b>Settings — two-pane.</b> Category list stays on the left, the selected section's fields render on the right (classic tablet settings), instead of drill-in/back.`,
  stock:`<b>Stock Check.</b> Count tiles auto-fill by width; a docked right panel keeps running progress + variance + finish action always visible.`,
  day:`<b>Day Session.</b> Form-shaped screen — centered and width-capped so it reads as a card, not a stretched full-bleed row.`
};

const screen=document.getElementById('screen');
function render(s){screen.innerHTML=views[s]();document.getElementById('hint').innerHTML=hints[s];}
document.getElementById('screens').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#screens button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');render(b.dataset.s);
});
const tt=document.getElementById('tt');
tt.onclick=()=>{const d=document.body.dataset.theme==='dark';document.body.dataset.theme=d?'light':'dark';tt.textContent=d?'◐ Dark':'◑ Light';};
render('dash');
</script>
</body>
</html>

<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sale List Preview</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet">
<style>
    body { background: var(--bs-tertiary-bg); font-size: .875rem; }
    .preview-bar { position: sticky; top: 0; z-index: 1030; }
    .table > :not(caption) > * > * { padding-top: .35rem; padding-bottom: .35rem; }
    .filter-chip { font-weight: 500; }
    .filter-chip .fa-times { cursor: pointer; opacity: .6; }
    .filter-chip .fa-times:hover { opacity: 1; }
    .w-date { width: 8.5rem; }
    .w-sel { width: 10rem; }
    .variant { display: none; }
    .variant.active { display: block; }
    .item-only { display: none !important; }
    body.tab-items .item-only { display: revert !important; }
    body.tab-items .invoice-only { display: none !important; }
</style>
</head>
<body>

<!-- preview-only chrome -->
<div class="preview-bar bg-dark text-white px-3 py-2 d-flex flex-wrap gap-2 align-items-center">
    <strong class="me-2"><i class="fa fa-eye me-1"></i> Sale list preview</strong>
    <div class="btn-group btn-group-sm" role="group">
        <button class="btn btn-light" data-variant="a">A · Inline bar</button>
        <button class="btn btn-outline-light" data-variant="b">B · Filter drawer</button>
        <button class="btn btn-outline-light" data-variant="c">C · Collapsible grid</button>
    </div>
    <button class="btn btn-sm btn-outline-light ms-auto" id="themeToggle"><i class="fa fa-adjust me-1"></i> Dark / Light</button>
</div>

<div class="container-fluid py-3">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-1 small"><li class="breadcrumb-item"><a href="#">Home</a></li><li class="breadcrumb-item active">Sale</li></ol>
    </nav>
    <h1 class="h4 mb-3">Sale</h1>

    <div class="card shadow-sm">
        <div class="card-header bg-body py-2">

            <!-- Row 1 (shared): view tabs + actions -->
            <div class="d-flex flex-wrap align-items-center gap-2">
                <ul class="nav nav-pills nav-sm gap-1" role="tablist">
                    <li class="nav-item"><button class="nav-link py-1 px-3 active" data-tab="invoices"><i class="fa fa-file-text-o me-1"></i> Invoices <span class="badge text-bg-light border ms-1">128</span></button></li>
                    <li class="nav-item"><button class="nav-link py-1 px-3" data-tab="items"><i class="fa fa-list me-1"></i> Items <span class="badge text-bg-light border ms-1">412</span></button></li>
                </ul>
                <div class="ms-auto d-flex flex-wrap gap-2 align-items-center">
                    <div class="input-group input-group-sm" style="width: 15rem;">
                        <span class="input-group-text"><i class="fa fa-search"></i></span>
                        <input class="form-control" placeholder="Search invoice, customer, item...">
                    </div>
                    <select class="form-select form-select-sm" style="width: 6.5rem;"><option>50 rows</option><option>100 rows</option><option>500 rows</option></select>
                    <div class="btn-group btn-group-sm">
                        <button class="btn btn-outline-secondary" title="Columns"><i class="fa fa-columns"></i></button>
                        <button class="btn btn-outline-secondary invoice-only" title="Import"><i class="fa fa-upload"></i></button>
                        <button class="btn btn-outline-secondary" title="Export"><i class="fa fa-file-excel-o"></i></button>
                        <button class="btn btn-outline-danger invoice-only" title="Delete selected"><i class="fa fa-trash-o"></i></button>
                    </div>
                </div>
            </div>

            <!-- ===== Variant A: one-line inline bar + "More" collapse ===== -->
            <div class="variant active" id="variant-a">
                <div class="d-flex flex-wrap gap-2 align-items-center mt-2 pt-2 border-top">
                    <div class="input-group input-group-sm w-auto">
                        <select class="form-select form-select-sm" style="max-width: 7.5rem;"><option>Invoice date</option><option>Created at</option></select>
                        <input type="date" class="form-control w-date" value="2026-10-19">
                        <span class="input-group-text px-1"><i class="fa fa-long-arrow-right"></i></span>
                        <input type="date" class="form-control w-date" value="2026-10-19">
                    </div>
                    <select class="form-select form-select-sm w-sel"><option>All Customers</option><option>Ahmed Al-Kuwari</option></select>
                    <select class="form-select form-select-sm w-sel"><option>Doha Main</option><option>All Branches</option></select>
                    <select class="form-select form-select-sm" style="width: 8rem;"><option>Completed</option><option>Draft</option><option>All Statuses</option></select>
                    <select class="form-select form-select-sm w-sel item-only"><option>All Products</option><option>Linen Shirt</option></select>
                    <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="collapse" data-bs-target="#moreA">
                        <i class="fa fa-sliders me-1"></i> More <span class="badge text-bg-primary ms-1">1</span>
                    </button>
                </div>
                <div class="collapse" id="moreA">
                    <div class="d-flex flex-wrap gap-2 mt-2">
                        <select class="form-select form-select-sm w-sel"><option>All Sale Types</option><option>Retail</option><option>Wholesale</option></select>
                        <select class="form-select form-select-sm w-sel"><option>POS</option><option>All Sources</option></select>
                        <select class="form-select form-select-sm w-sel"><option>All Users</option></select>
                        <select class="form-select form-select-sm w-sel"><option>All Payment Methods</option><option>Cash</option><option>Card</option></select>
                        <select class="form-select form-select-sm w-sel item-only"><option>All Employees</option></select>
                    </div>
                </div>
                <div class="chips-slot"></div>
            </div>

            <!-- ===== Variant B: search + date only, everything else in an offcanvas ===== -->
            <div class="variant" id="variant-b">
                <div class="d-flex flex-wrap gap-2 align-items-center mt-2 pt-2 border-top">
                    <div class="btn-group btn-group-sm">
                        <button class="btn btn-outline-secondary">Today</button>
                        <button class="btn btn-outline-secondary">Yesterday</button>
                        <button class="btn btn-outline-secondary">This week</button>
                        <button class="btn btn-outline-secondary">This month</button>
                    </div>
                    <div class="input-group input-group-sm w-auto">
                        <input type="date" class="form-control w-date" value="2026-10-19">
                        <span class="input-group-text px-1"><i class="fa fa-long-arrow-right"></i></span>
                        <input type="date" class="form-control w-date" value="2026-10-19">
                    </div>
                    <button class="btn btn-sm btn-primary" data-bs-toggle="offcanvas" data-bs-target="#filterDrawer">
                        <i class="fa fa-filter me-1"></i> Filters <span class="badge text-bg-light ms-1">3</span>
                    </button>
                </div>
                <div class="chips-slot"></div>
            </div>

            <!-- ===== Variant C: label-less dense grid that collapses away ===== -->
            <div class="variant" id="variant-c">
                <div class="d-flex align-items-center gap-2 mt-2 pt-2 border-top">
                    <button class="btn btn-sm btn-link text-decoration-none p-0 fw-semibold" data-bs-toggle="collapse" data-bs-target="#gridC">
                        <i class="fa fa-filter me-1"></i> Filters <i class="fa fa-angle-down ms-1"></i>
                    </button>
                    <div class="chips-slot flex-grow-1"></div>
                </div>
                <div class="collapse show" id="gridC">
                    <div class="row g-2 mt-1 row-cols-2 row-cols-md-3 row-cols-xl-6">
                        <div class="col"><select class="form-select form-select-sm" title="Based on"><option>Invoice date</option><option>Created at</option></select></div>
                        <div class="col"><input type="date" class="form-control form-control-sm" value="2026-10-19" title="From"></div>
                        <div class="col"><input type="date" class="form-control form-control-sm" value="2026-10-19" title="To"></div>
                        <div class="col"><select class="form-select form-select-sm"><option>All Customers</option></select></div>
                        <div class="col"><select class="form-select form-select-sm"><option>Doha Main</option></select></div>
                        <div class="col"><select class="form-select form-select-sm"><option>Completed</option></select></div>
                        <div class="col"><select class="form-select form-select-sm"><option>All Sale Types</option></select></div>
                        <div class="col"><select class="form-select form-select-sm"><option>POS</option></select></div>
                        <div class="col"><select class="form-select form-select-sm"><option>All Users</option></select></div>
                        <div class="col"><select class="form-select form-select-sm"><option>All Payment Methods</option></select></div>
                        <div class="col item-only"><select class="form-select form-select-sm"><option>All Products</option></select></div>
                        <div class="col item-only"><select class="form-select form-select-sm"><option>All Employees</option></select></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Summary strip (shared) -->
        <div class="d-flex flex-wrap gap-4 px-3 py-2 border-bottom small bg-body-tertiary" id="summary"></div>

        <div class="table-responsive">
            <table class="table table-striped table-hover table-sm align-middle mb-0">
                <thead class="text-nowrap" id="thead"></thead>
                <tbody id="tbody"></tbody>
                <tfoot class="fw-bold" id="tfoot"></tfoot>
            </table>
        </div>
        <div class="card-footer bg-body d-flex justify-content-between align-items-center small text-muted">
            <span id="showing"></span>
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item disabled"><a class="page-link">&laquo;</a></li>
                <li class="page-item active"><a class="page-link">1</a></li>
                <li class="page-item"><a class="page-link">2</a></li>
                <li class="page-item"><a class="page-link">3</a></li>
                <li class="page-item"><a class="page-link">&raquo;</a></li>
            </ul>
        </div>
    </div>

    <p class="text-muted small mt-3 mb-0">
        <i class="fa fa-info-circle me-1"></i>
        The Items tab shares every filter with Invoices; Product and Employee filters only appear on the Items tab.
        Import and Delete are hidden on Items because they act on whole invoices.
    </p>
</div>

<!-- Offcanvas for variant B -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="filterDrawer" style="width: 22rem;">
    <div class="offcanvas-header border-bottom py-2">
        <h6 class="offcanvas-title mb-0"><i class="fa fa-filter me-1"></i> Filters</h6>
        <button class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body vstack gap-2">
        <label class="form-label small text-muted mb-0">Based on</label>
        <select class="form-select form-select-sm"><option>Invoice date</option><option>Created at</option></select>
        <label class="form-label small text-muted mb-0">Customer</label>
        <select class="form-select form-select-sm"><option>All Customers</option></select>
        <label class="form-label small text-muted mb-0">Branch</label>
        <select class="form-select form-select-sm"><option>Doha Main</option></select>
        <label class="form-label small text-muted mb-0">Status</label>
        <select class="form-select form-select-sm"><option>Completed</option></select>
        <label class="form-label small text-muted mb-0">Sale Type</label>
        <select class="form-select form-select-sm"><option>All Sale Types</option></select>
        <label class="form-label small text-muted mb-0">Source</label>
        <select class="form-select form-select-sm"><option>POS</option></select>
        <label class="form-label small text-muted mb-0">Created By</label>
        <select class="form-select form-select-sm"><option>All Users</option></select>
        <label class="form-label small text-muted mb-0">Payment Method</label>
        <select class="form-select form-select-sm"><option>All Payment Methods</option></select>
        <div class="item-only vstack gap-2">
            <label class="form-label small text-muted mb-0">Product</label>
            <select class="form-select form-select-sm"><option>All Products</option></select>
            <label class="form-label small text-muted mb-0">Employee</label>
            <select class="form-select form-select-sm"><option>All Employees</option></select>
        </div>
    </div>
    <div class="offcanvas-footer border-top p-2 d-flex gap-2">
        <button class="btn btn-sm btn-outline-secondary flex-fill">Reset</button>
        <button class="btn btn-sm btn-primary flex-fill" data-bs-dismiss="offcanvas">Done</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const invoices = [
    [24081, '19-10-2026', 'INV-24081', 'Ahmed Al-Kuwari', 'Cash', 'Rahees', 1250, 1250, 0, 'completed'],
    [24080, '19-10-2026', 'INV-24080', 'Walk-in Customer', 'Card', 'Rahees', 340.5, 340.5, 0, 'completed'],
    [24079, '19-10-2026', 'INV-24079', 'Fatima Hassan', 'Cash, Card', 'Sana', 2180, 1500, 680, 'completed'],
    [24078, '19-10-2026', 'INV-24078', 'Mohammed Saleh', 'Credit', 'Sana', 860, 0, 860, 'completed'],
    [24077, '19-10-2026', 'INV-24077', 'Walk-in Customer', 'Cash', 'Rahees', 95, 95, 0, 'completed'],
    [24076, '19-10-2026', 'INV-24076', 'Noora Al-Thani', 'Card', 'Arjun', 4420, 4420, 0, 'completed'],
    [24075, '19-10-2026', 'INV-24075', 'Khalid Ibrahim', 'Cash', 'Arjun', 615, 615, 0, 'completed'],
];
const items = [
    [24081, '19-10-2026', 'INV-24081', 'Ahmed Al-Kuwari', 'Linen Shirt — White / L', 'Sana', 2, 250, 0, 500],
    [24081, '19-10-2026', 'INV-24081', 'Ahmed Al-Kuwari', 'Chino Trouser — Navy / 32', 'Sana', 3, 250, 0, 750],
    [24080, '19-10-2026', 'INV-24080', 'Walk-in Customer', 'Cotton Socks (3 pack)', 'Rahees', 3, 45, 0, 135],
    [24080, '19-10-2026', 'INV-24080', 'Walk-in Customer', 'Leather Belt — Brown', 'Rahees', 1, 220, 14.5, 205.5],
    [24079, '19-10-2026', 'INV-24079', 'Fatima Hassan', 'Abaya — Classic Black / 56', 'Arjun', 2, 950, 60, 1840],
    [24079, '19-10-2026', 'INV-24079', 'Fatima Hassan', 'Silk Shayla — Ivory', 'Arjun', 2, 170, 0, 340],
    [24078, '19-10-2026', 'INV-24078', 'Mohammed Saleh', 'Thobe — Qatari Cut / 58', 'Sana', 2, 430, 0, 860],
    [24077, '19-10-2026', 'INV-24077', 'Walk-in Customer', 'Ghutra — White', 'Rahees', 1, 95, 0, 95],
];
const money = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const sum = (rows, i) => rows.reduce((t, r) => t + r[i], 0);

function render(tab) {
    const thead = document.getElementById('thead'), tbody = document.getElementById('tbody'), tfoot = document.getElementById('tfoot');
    const summary = document.getElementById('summary'), showing = document.getElementById('showing');
    if (tab === 'invoices') {
        thead.innerHTML = `<tr><th class="ps-3"><input type="checkbox" class="form-check-input me-2">#</th><th>Date</th><th>Invoice No</th><th>Customer</th><th>Payment Method</th><th>Created By</th><th class="text-end">Grand Total</th><th class="text-end">Paid</th><th class="text-end pe-3">Balance</th></tr>`;
        tbody.innerHTML = invoices.map(r => `<tr><td class="ps-3"><input type="checkbox" class="form-check-input me-2">${r[0]}</td><td>${r[1]}</td><td><a href="#">${r[2]}</a></td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td><td class="text-end">${money(r[6])}</td><td class="text-end">${money(r[7])}</td><td class="text-end pe-3 ${r[8] ? 'text-danger' : ''}">${money(r[8])}</td></tr>`).join('');
        tfoot.innerHTML = `<tr><td colspan="6" class="ps-3">TOTALS</td><td class="text-end">${money(sum(invoices, 6))}</td><td class="text-end">${money(sum(invoices, 7))}</td><td class="text-end pe-3 text-danger">${money(sum(invoices, 8))}</td></tr>`;
        summary.innerHTML = `<span><span class="text-muted">Invoices</span> <strong>128</strong></span><span><span class="text-muted">Grand Total</span> <strong>48,250.00</strong></span><span><span class="text-muted">Paid</span> <strong class="text-success">45,710.00</strong></span><span><span class="text-muted">Balance</span> <strong class="text-danger">2,540.00</strong></span>`;
        showing.textContent = 'Showing 1 to 7 of 128 invoices';
    } else {
        thead.innerHTML = `<tr><th class="ps-3">#</th><th>Date</th><th>Invoice No</th><th>Customer</th><th>Product</th><th>Employee</th><th class="text-end">Qty</th><th class="text-end">Unit Price</th><th class="text-end">Discount</th><th class="text-end pe-3">Total</th></tr>`;
        tbody.innerHTML = items.map((r, i) => `<tr><td class="ps-3">${i + 1}</td><td>${r[1]}</td><td><a href="#">${r[2]}</a></td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td><td class="text-end">${r[6]}</td><td class="text-end">${money(r[7])}</td><td class="text-end">${money(r[8])}</td><td class="text-end pe-3">${money(r[9])}</td></tr>`).join('');
        tfoot.innerHTML = `<tr><td colspan="6" class="ps-3">TOTALS</td><td class="text-end">${sum(items, 6)}</td><td></td><td class="text-end">${money(sum(items, 8))}</td><td class="text-end pe-3">${money(sum(items, 9))}</td></tr>`;
        summary.innerHTML = `<span><span class="text-muted">Lines</span> <strong>412</strong></span><span><span class="text-muted">Qty sold</span> <strong>987</strong></span><span><span class="text-muted">Discount</span> <strong>1,320.00</strong></span><span><span class="text-muted">Net Total</span> <strong>48,250.00</strong></span>`;
        showing.textContent = 'Showing 1 to 8 of 412 items';
    }
}

function renderChips() {
    const chips = ['Branch: Doha Main', 'Status: Completed', 'Source: POS'];
    document.querySelectorAll('.chips-slot').forEach(slot => {
        slot.innerHTML = `<div class="d-flex flex-wrap gap-1 align-items-center ${slot.closest('#variant-c') ? '' : 'mt-2'}">` +
            chips.map(c => `<span class="badge rounded-pill text-bg-light border filter-chip">${c} <i class="fa fa-times ms-1"></i></span>`).join('') +
            `<a href="#" class="small ms-1">Clear all</a></div>`;
    });
}

document.querySelectorAll('[data-tab]').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('active', b === btn));
    document.body.classList.toggle('tab-items', btn.dataset.tab === 'items');
    render(btn.dataset.tab);
}));
document.querySelectorAll('[data-variant]').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('[data-variant]').forEach(b => { b.classList.toggle('btn-light', b === btn); b.classList.toggle('btn-outline-light', b !== btn); });
    document.querySelectorAll('.variant').forEach(v => v.classList.toggle('active', v.id === 'variant-' + btn.dataset.variant));
}));
document.getElementById('themeToggle').addEventListener('click', () => {
    const html = document.documentElement;
    html.dataset.bsTheme = html.dataset.bsTheme === 'dark' ? 'light' : 'dark';
});
render('invoices');
renderChips();
</script>
</body>
</html>

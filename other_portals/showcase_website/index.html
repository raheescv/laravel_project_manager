<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Pick your size once. From there you only see pairs that are actually on the shelf in your size."
    />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" href="./favicon.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#1E2ED6" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Size Run — Sneakers for Everyone</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      /*
       * Old store links (/collections/onitsuka-tiger, /products/…, /search?q=…)
       * land on this page with a deep path. The app routes by hash (#/…) and its
       * assets are relative, so from such a path they would be fetched from
       * /collections/assets/… and the page would stay blank. Send the visitor to
       * the app's own folder with the matching #/ route before anything loads.
       */
      ;(function () {
        var m = location.pathname.match(/^(.*?\/)(collections|products|search|pages|blogs|cart|account)(\/.*)?$/i)
        if (!m) return
        var kind = m[2].toLowerCase()
        var parts = (m[3] || '').split('/').filter(Boolean)
        var hash = '#/'
        var product = kind === 'products' ? parts[0] : kind === 'collections' && parts[1] === 'products' ? parts[2] : ''
        if (product) hash = '#/product/' + encodeURIComponent(product)
        else if (kind === 'collections' && parts[0]) hash = '#/?collection=' + encodeURIComponent(parts[0])
        else if (kind === 'search') {
          var q = new URLSearchParams(location.search).get('q')
          if (q) hash = '#/?q=' + encodeURIComponent(q)
        }
        location.replace(m[1] + hash)
      })()
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

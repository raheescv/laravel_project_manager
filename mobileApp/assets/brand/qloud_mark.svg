  <rect x="0" y="0" width="900" height="900" fill="url(#gCloud)" mask="url(#mCloud)"/>
  <rect x="0" y="0" width="900" height="900" fill="url(#gRing)" mask="url(#mRing)"/>
  <g mask="url(#mRing)">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="155 155 547 421" width="547" height="421">
  <defs>
    <linearGradient id="gCloud" gradientUnits="userSpaceOnUse" x1="190" y1="250" x2="690" y2="430">
      <stop offset="0" stop-color="#06ABFE"/>
      <stop offset="0.52" stop-color="#0A83E6"/>
      <stop offset="1" stop-color="#0A4EB0"/>
    </linearGradient>
    <linearGradient id="gRing" gradientUnits="userSpaceOnUse" x1="315" y1="525" x2="565" y2="330">

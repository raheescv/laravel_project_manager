    </mask>

    <mask id="mRing">
      <rect x="0" y="0" width="900" height="900" fill="black"/>
      <circle cx="433" cy="425" r="147" fill="white"/>
      <circle cx="433" cy="425" r="89" fill="black"/>
      <polygon points="388,400 460,400 650,590 578,590" fill="black"/>

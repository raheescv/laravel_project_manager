# JVM heap: this is a 16GB machine and Gradle spawns a daemon per project.
# 8G here meant two daemons alone reserved the entire machine and it swapped.
# 3G is comfortably above what R8 + AGP need for this single-module app.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError

# Reuse task outputs across builds — the big win on repeat release builds.
org.gradle.caching=true
org.gradle.daemon=true
# 8 cores; leave 2 for the Dart AOT compile that runs alongside Gradle.
org.gradle.workers.max=6
# Only one module (:app), so parallel buys nothing and costs a second daemon.
org.gradle.parallel=false
org.gradle.configureondemand=true

kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx1G

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
android.nonTransitiveRClass=true

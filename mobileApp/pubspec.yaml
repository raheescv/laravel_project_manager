name: invo
description: "Invo — premium salon POS & admin (mobile + tablet)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management (BLoC / Cubit) + DI
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.7
  get_it: ^8.0.3

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  # Where the product-photo cache lives. Already pulled in transitively; declared
  # because `ImageStore` imports it directly, and a transitive dependency can be
  # dropped by an unrelated package upgrade.
  path_provider: ^2.1.6

  # Biometric auth (Touch ID / Face ID / fingerprint)
  local_auth: ^2.3.0

  # Camera barcode / QR scanning (iOS / Android / macOS)
  mobile_scanner: ^7.2.0

  # Profile photo capture / library picking + custom in-app cropping
  image_picker: ^1.1.2
  crop_your_image: ^2.0.0

  # UI
  google_fonts: ^6.2.1
  intl: ^0.20.1

  # Receipt printing + share sheet (generates a PDF; iOS / Android / macOS / web)
  printing: ^5.13.4
  pdf: ^3.11.1

  # Re-exported by flutter_bloc for context.read/watch in widgets.
  provider: ^6.1.2
  permission_handler: ^12.0.3

  # Offline POS: the catalog snapshot and the pending-sale outbox live in one
  # sqflite database. Prefs can't hold them — a whole-blob rewrite loses a
  # queued sale if the process dies mid-write, and the catalog needs indexed
  # search rather than a multi-megabyte decode on every cold start.
  sqflite: ^2.4.3
  path: ^1.9.1
  # v4 idempotency key stamped on a sale the moment Charge is tapped.
  uuid: ^4.6.0
  # A hint that syncing is worth attempting — never the source of truth for
  # "are we online"; a failed request is.
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  # Runs the offline sqflite database in-process so the outbox and the catalog
  # snapshot can be tested without a device.
  sqflite_common_ffi: ^2.4.2

flutter:
  uses-material-design: true
  # IBM Plex Sans Arabic (OFL) — bundled so Arabic thermal receipts render
  # offline at the POS.
  assets:
    - assets/fonts/IBMPlexSansArabic-Regular.ttf
    - assets/fonts/IBMPlexSansArabic-Bold.ttf

# Invo launcher icon — gold "i" logomark on a warm-dark tile.
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/invo_icon.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/invo_icon_bg.png"
  adaptive_icon_foreground: "assets/icon/invo_icon_fg.png"
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/icon/invo_icon.png"
  web:
    generate: true
    image_path: "assets/icon/invo_icon.png"
    background_color: "#121212"
    theme_color: "#C9A24B"

# Static analysis configuration. `flutter analyze lib` is the check for this
# package — the codebase is kept at zero issues.
#
# NOTE: never run `dart format` / `flutter format` here. This codebase uses a
# compact hand-written style; formatting produces ~6000 lines of churn.
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # ---- Resource and lifecycle safety ----
    # Every one of these is already satisfied by the whole codebase, so they are
    # enabled as regression guards rather than as a cleanup backlog.
    - cancel_subscriptions          # StreamSubscription must be cancelled in dispose
    - close_sinks                   # Sinks/controllers must be closed
    - use_build_context_synchronously  # No BuildContext across an await gap
    - unawaited_futures             # Fire-and-forget must say so via unawaited()

    # ---- Correctness ----
    - avoid_dynamic_calls           # No method calls on `dynamic` (API maps must be coerced)
    - test_types_in_equals          # operator == must type-check its argument
    - throw_in_finally              # A throw in finally swallows the original error
    - literal_only_boolean_expressions  # Conditions that can never vary
    - avoid_empty_else
    - unnecessary_statements        # Expressions whose result is discarded
    - no_adjacent_strings_in_list   # Usually a missing comma

    # ---- Clarity ----
    - always_declare_return_types
    - prefer_final_locals
    - use_late_for_private_fields_and_variables
    - avoid_slow_async_io
    - prefer_void_to_null
    - avoid_returning_null_for_void
